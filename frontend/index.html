<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23032D60'/%3E%3Ctext x='32' y='42' font-size='22' font-family='Arial' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EUTN%3C/text%3E%3C/svg%3E">
<script>
window.API_CONFIG={
  url:window.location.hostname==='localhost'?'http://localhost:3001/api/v1':'https://utn-api.yourguyandy1.workers.dev/api/v1',
  syncEnabled:true,
  syncInterval:30000
};
const syncCache={users:{},data:{},lastSync:0};
async function apiCall(method,path,data){
  try{
    const res=await fetch(window.API_CONFIG.url+path,{
      method,headers:{'Content-Type':'application/json'},
      credentials:'include',body:data?JSON.stringify(data):undefined
    });
    if(!res.ok)throw new Error('API error: '+res.status);
    return await res.json();
  }catch(e){console.warn('API sync failed:',e.message);return null;}
}
async function syncDataWithBackend(){
  if(!window.API_CONFIG.syncEnabled||!window.user)return;
  try{
    const result=await apiCall('GET','/data/sync?user_id='+window.user.id);
    if(result&&result.data)Object.assign(syncCache,result.data);
  }catch(e){console.warn('Sync failed:',e);}
}
setInterval(syncDataWithBackend,window.API_CONFIG.syncInterval);
</script>
<style>
:root{
  --acc:#0EA5E9; --acc2:#0284C7; --acc-soft:#cffafe;
  --cyan:#0EA5E9; --purple:#8B5CF6; --teal:#14B8A6; --pink:#ec4899;
  --bg:#fafafa; --card:#ffffff; --ink:#032D60; --mut:#4d6a89;
  --line:#e5e5e5; --danger:#dc2626; --warn:#7c3aed; --ok:#16a34a;
  --side:#032D60; --side-ink:#ffffff;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}

.req::after{content:' *';color:var(--danger)}

/* layout */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:225px;background:var(--side-grad);background-attachment:fixed;color:var(--side-ink);padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.side::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.35)}
.side-copy{margin-top:auto;padding:14px 10px 4px;font-size:10.5px;color:rgba(255,255,255,.45);line-height:1.3}
.side-copy .powered{display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:4px}
.side .brand{color:#fff;font-weight:700;font-size:16px;padding:10px 10px 16px;line-height:1.25;display:flex;align-items:center;gap:10px}
.side .brand .ver{color:var(--side-ink);font-weight:600;font-size:11.5px}
/* The real UTN wordmark replaces the old "UTN" text placeholder. Uses the flat logo, not the 3D
   render — at this size the 3D version's truck/cars/sub-text turn to mush, while the flat mark
   stays sharp. It's artwork on white, so it sits on a white tile rather than floating on navy. */
.side .brand{flex-direction:column;align-items:stretch;gap:8px}
.brand-logo{width:64px;height:64px;display:block;border-radius:10px;
  object-fit:contain;margin:0 0 8px 0;
  filter:brightness(1.18) contrast(1.1) drop-shadow(0 0 15px rgba(59,130,246,.35));
  background:radial-gradient(circle at center,rgba(37,99,235,.2) 0%,rgba(15,23,42,.5) 100%);
  border:2.5px solid rgba(255,255,255,.8);
  box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 10px rgba(59,130,246,.2),inset 0 1px 1px rgba(255,255,255,.3);
  transition:all .3s ease}
.brand-logo:hover{transform:scale(1.05);filter:brightness(1.22) contrast(1.12) drop-shadow(0 0 20px rgba(59,130,246,.45))}
.side .brand .ver{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.side a{display:block;color:var(--side-ink);padding:7px 10px;border-radius:8px;font-weight:500;line-height:1.3}
.nav-ur{display:block;font-size:11px;font-weight:400;opacity:.72;margin-top:1px;direction:rtl}
.side a:hover{background:rgba(255,255,255,.08);color:#fff}
.side a.on{background:var(--warn);color:#fff}
.nav-group{margin-bottom:0}.nav-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--side-ink);padding:12px 10px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;user-select:none}.nav-toggle:hover{color:#fff}.nav-caret{display:inline-block;transition:transform .2s;font-size:8px;margin-left:6px}.nav-group[data-open="false"] .nav-caret{transform:rotate(-90deg)}.nav-items{overflow:hidden;transition:max-height .2s ease,opacity .2s ease;max-height:1000px;opacity:1}.nav-group[data-open="false"] .nav-items{max-height:0;opacity:0}
.side .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f7f7a;padding:12px 10px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--side-grad);background-attachment:fixed;border-bottom:1px solid rgba(255,255,255,.14);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:5}
.scrollarea{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.topbar .sp{flex:1}
.topbar .who{font-weight:600;font-size:13.5px;color:#fff}
.topbar .clock{font-size:12.5px;color:var(--side-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.content{padding:24px;max-width:1180px;width:100%;margin:0 auto}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:20px}
.pagehead .sp{flex:1}

/* components */
.card{background:var(--card);border:0;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.07)}
.card.accent{border-top:4px solid var(--acc);padding-top:15px}
.card.accent-ok{border-top-color:var(--ok)}
.card.accent-warn{border-top-color:var(--warn)}
.card.accent-ink{border-top-color:var(--ink)}
.card h2{display:flex;align-items:center;gap:8px}
.dangerzone{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px;margin-top:14px}
.dangerzone .dz-title{color:var(--danger);font-weight:700;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar input[type=text]{width:auto;min-width:200px;max-width:260px}
.fbar select{width:auto;min-width:130px;max-width:190px}
.avatar{width:32px;height:32px;border-radius:99px;color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.navy{background:#0176D3}
.avatar.gold{background:var(--warn)}
.card h2{font-size:15px;margin-bottom:10px}
.form-section h2{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stepnum{width:26px;height:26px;border-radius:50%;background:var(--warn);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.charge-freight input{font-size:19px;font-weight:700;color:var(--ink);border-color:var(--acc2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
.dash-kpis .stat{padding:14px 14px;display:flex;flex-direction:column;min-height:115px;justify-content:space-between}
.dash-kpis .stat .v{font-size:17px;line-height:1.4}
.dash-kpis .stat .l{line-height:1.25;min-height:2.5em}
.stat{background:var(--card);border:0;border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);transition:transform .15s ease,box-shadow .15s ease}
.stat:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.07)}
.stat .v{font-size:21px;font-weight:700;margin-top:2px}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.welcome-banner{background:var(--card);color:var(--mut);border:0;border-radius:16px;padding:16px 18px;margin-bottom:16px;font-size:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
.welcome-banner .co{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.welcome-banner .nm{color:var(--acc);font-weight:700}
.agedot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
table{width:100%;border-collapse:collapse;background:var(--card)}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
/* Tables scroll sideways, so nothing needs to break mid-value — a trip number, a date or a
   name split across two lines is what made rows ragged and tall. Cells holding real prose opt
   back in with class="wrap". */
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:220px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafa}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* two related values stacked in one cell instead of two columns — e.g. carrier over driver.
   Each line truncates on its own (a long carrier name shouldn't push a short driver name
   off-width, or vice versa) — full text is still on the cell's title tooltip. */
td.stack2{line-height:1.35;max-width:190px}
td.stack2 b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.stack2 .s2-sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12px}
/* a route with several stops — truncate to one line, full text on hover */
td.routecell{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a clickable choice card — e.g. picking how to create an invoice */
.pickcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;cursor:pointer;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.pickcard:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(16,24,40,.08)}
.pickcard b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px}
.pickcard span{display:block;font-size:12.5px;color:var(--mut);line-height:1.4}
/* a row of small action buttons (print/edit/delete) — tighter than the default .btn.sm gap */
td.actions{white-space:nowrap}
td.actions .btn.sm{padding:4px 9px;margin-left:3px}
td.actions .btn.sm:first-child{margin-left:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13.5px;box-shadow:0 2px 8px rgba(14,165,233,.15);transition:all .2s ease}
.btn:hover{background:var(--acc2);box-shadow:0 4px 14px rgba(14,165,233,.3);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn.ghost:hover{background:#f9fafb;border-color:var(--acc);color:var(--acc);box-shadow:0 2px 8px rgba(14,165,233,.1)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca;box-shadow:0 1px 4px rgba(220,38,38,.06)}
.btn.danger:hover{background:#fef2f2;border-color:#f87171;box-shadow:0 2px 8px rgba(220,38,38,.15)}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:8px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.b-gray{background:#f1f5f9;color:#475569}.b-green{background:#dcfce7;color:#15803d}
.b-amber{background:#ede9fe;color:#6d28d9}.b-red{background:#fee2e2;color:#b91c1c}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-teal{background:var(--acc-soft);color:var(--acc2)}
.chip{font-size:11px;background:var(--warn);color:#fff;border-radius:6px;padding:3px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.frow{margin-bottom:2px}
.urdu{direction:rtl;font-size:.82em;font-weight:400;opacity:.75;font-family:'Jameel Noori Nastaleeq','Noto Nastaliq Urdu','Segoe UI',sans-serif}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.suggest{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.warnbox{background:#f5f3ff;border:1px solid #c4b5fd;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px;color:#5b21b6}
.empty{padding:28px;text-align:center;color:var(--mut)}
.searchbox{max-width:230px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}

/* help/faq */
.help-header{background:linear-gradient(135deg,#032D60,#0454a3);color:#fff;padding:14px;border-radius:8px 8px 0 0;margin:-20px -20px 16px}
.help-header h2{margin:0;font-size:16px}

.faq-topic h3{background:#f9fafb;padding:12px;margin:0;cursor:pointer;font-size:13.5px;color:#032D60;font-weight:600;border-bottom:1px solid #e5e5e5;user-select:none;opacity:1;transition:opacity .2s}

.faq-items{padding:8px 0}
.faq{border-bottom:1px solid #f0f0f0;padding:0}
.faq:last-child{border:0}

.faq div{padding:12px 14px;font-size:12.5px;color:#555;line-height:1.5;display:none;border-top:1px solid #f0f0f0;background:#fafafa}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toastmsg{background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease}
.toastmsg.err{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* checklist */
.ckrow{display:grid;grid-template-columns:26px 1fr 1fr auto minmax(120px,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ckrow:last-child{border-bottom:0}
.ckstates{display:flex;gap:4px}
.ckb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--mut)}
.ckb.on-present{background:#dcfce7;border-color:#86efac;color:#15803d}
.ckb.on-missing{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.ckb.on-damaged{background:#ede9fe;border-color:#c4b5fd;color:#6d28d9}
.ckrow input{padding:4px 8px;font-size:12.5px}

/* login */
/* height (not min-height): <body> is height:100%/overflow:hidden, so a wrapper allowed to grow
   past the viewport would have its overflow clipped by the body and become unreachable — on a
   short screen the bottom of the login card simply couldn't be scrolled to. Pinning it to the
   viewport makes its own overflow-y:auto the thing that scrolls. */
.loginwrap{height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;position:relative;
  background:radial-gradient(circle at 18% 28%,#0d2552 0%,#05132d 52%,#020712 100%)}
/* Ambient corner glows — blue top-left, amber bottom-right, echoing the LoadYar wordmark's
   two-tone gradient. Purely decorative, so they sit behind everything and ignore pointer events.
   position:fixed (not absolute) on purpose: they deliberately bleed past the viewport edges, and
   as absolutely-positioned children they were padding the wrapper's scroll height — giving the
   login page ~160px of empty scroll below the content. Fixed keeps them out of the scroll flow. */
.loginwrap::before,.loginwrap::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.loginwrap::before{width:520px;height:520px;top:-120px;left:-110px;
  background:radial-gradient(circle,rgba(37,99,235,.26) 0%,rgba(0,0,0,0) 70%)}
.loginwrap::after{width:600px;height:600px;bottom:-160px;right:-110px;
  background:radial-gradient(circle,rgba(245,158,11,.13) 0%,rgba(0,0,0,0) 70%)}
.login-hero{flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:56px 60px;color:#fff;position:relative;overflow:hidden;min-width:0;z-index:1}
.login-net{position:absolute;inset:0;width:100%;height:100%}
.login-hero .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3b82f6 0%,#f59e0b 100%);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:24px;color:#fff;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);position:relative}
/* The platform name is the headline act here — sized well above the client workspace name below
   it so the hierarchy reads LoadYar first, UTN second. */
.login-hero .loadyar-mark{font-size:clamp(42px,5.4vw,64px);font-weight:900;letter-spacing:-.02em;line-height:1;position:relative;margin-bottom:8px}
.login-hero .ly-load{color:#fff}
.login-hero .ly-yar{background:linear-gradient(120deg,#60a5fa 0%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-hero .loadyar-tag{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:30px;position:relative}
.login-hero .workspace-wrap{display:flex;align-items:center;gap:22px;margin-bottom:26px;position:relative}
.login-hero .utn-logo{width:112px;height:auto;border-radius:14px;flex-shrink:0;
  box-shadow:0 14px 26px rgba(0,0,0,.5);transition:transform .3s ease}
.login-hero .utn-logo:hover{transform:scale(1.04) translateY(-3px)}
.login-hero .client-block{border-left:3px solid var(--acc);padding-left:16px;position:relative;min-width:0}
.login-hero .client-lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#60a5fa;margin-bottom:6px}
.login-hero h1{font-size:clamp(19px,2.2vw,25px);font-weight:700;letter-spacing:-.01em;margin-bottom:8px;position:relative;text-wrap:balance}
.login-hero .tag{font-size:14px;color:rgba(255,255,255,.68);max-width:400px;line-height:1.6;position:relative}
.login-hero .stats{display:flex;gap:14px;position:relative;max-width:520px}
.login-hero .metric{flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;
  padding:14px 16px;font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  transition:transform .3s ease,border-color .3s ease}
.login-hero .metric:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.35)}
.login-hero .metric b{display:block;font-size:26px;color:#fff;font-weight:800;text-transform:none;letter-spacing:0;margin-bottom:4px;font-variant-numeric:tabular-nums}
.login-hero .clockline{margin-top:26px;font-size:12.5px;color:rgba(255,255,255,.42);position:relative}
.login-card-side{flex:0 0 440px;display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;position:relative;z-index:1}
@media (max-width:980px){.login-hero .workspace-wrap{flex-direction:column;align-items:flex-start;gap:16px}}
@media (max-width:880px){.login-hero{display:none}.login-card-side{flex:1}}
.loginbox{margin:auto;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.28);color:#fff;position:relative;overflow:hidden}
.loginbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#3b82f6,#f59e0b)}
.loginbox .card-logo{width:56px;height:56px;border-radius:10px;margin:0 12px 12px 0;display:inline-block;object-fit:contain;
  filter:brightness(1.2) contrast(1.12) drop-shadow(0 0 12px rgba(59,130,246,.3));
  background:radial-gradient(circle at center,rgba(37,99,235,.15) 0%,rgba(15,23,42,.4) 100%);
  border:2.5px solid rgba(255,255,255,.8);
  box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 10px rgba(59,130,246,.2);
  vertical-align:middle}
.loginbox h1{font-size:19px;margin-bottom:2px;color:#fff}
.loginbox .sub{color:rgba(255,255,255,.72);font-size:13px;margin-bottom:18px}
.loginbox .vtag{background:rgba(255,255,255,.09);padding:1px 7px;border-radius:6px;font-size:12px;color:#cbd5e1;font-weight:600}
.loginbox .mut{color:rgba(255,255,255,.62)}
.userbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.15);color:#fff}
.userbtn:hover{border-color:var(--warn);background:rgba(255,255,255,.14)}
.userbtn .av{width:36px;height:36px;border-radius:99px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.userbtn .av.navy{background:#0176D3}
.userbtn .av.gold{background:var(--warn)}
.userbtn .nm{font-weight:600;color:#fff}

/* bar chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bars .bfill{width:100%;max-width:46px;background:var(--acc2);border-radius:6px 6px 0 0;min-height:2px}
.bars .blbl{font-size:11px;color:var(--mut);white-space:nowrap}
.bars .bval{font-size:11px;font-weight:700}

.rowline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.acc-card{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.acc-card:last-child{margin-bottom:0}
.acc-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.acc-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acc-actions{display:flex;gap:6px;flex-shrink:0}
/* auto-fit so a long figure never gets squeezed until it wraps mid-number — columns drop to a
   second row instead. Every card shows the same four, so cards line up with each other. */
.acc-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px 18px}
.acc-metrics>div{min-width:0}
.acc-ml{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:2px;white-space:nowrap}
.acc-mv{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rowline:last-child{border-bottom:0}

/* Deliberately no responsive/mobile breakpoint -- layout is fixed so it looks
   identical on every device (desktop, laptop, tablet, phone) on the office
   WiFi. Narrow screens scroll/zoom like any non-mobile-optimized website. */
@media print{.side,.topbar,.btn,#toast{display:none!important}.content{padding:0}
  /* release the fixed-viewport layout so the whole page prints, not just the visible part */
  html,body{height:auto!important;overflow:visible!important}
  .shell{height:auto!important;overflow:visible!important;display:block!important}
  .main{overflow:visible!important;display:block!important}
  .scrollarea{overflow:visible!important;min-height:0!important}}
</style>

/* Approximate position along Pakistan's main N-5/GT Road corridor (south→north) — only cities
   actually on that through-route. Used to suggest sensible en-route stops — not real GPS/distances. */
const CITY_MAINLINE_POS={
  'Karachi':0,'Hyderabad':10,'Nawabshah':20,'Sukkur':30,'Rahim Yar Khan':40,'Bahawalpur':50,
  'Multan':60,'Sahiwal':70,'Okara':75,'Lahore':80,'Gujranwala':90,'Gujrat':95,'Jhelum':100,
  'Rawalpindi':110,'Islamabad':111,'Peshawar':120

/* Off-mainline cities, mapped to their nearest mainline anchor — used only to place a trip
   starting/ending at one of these on the mainline for suggestion purposes, never suggested
   themselves as an intermediate stop (they're not actually on the way between two other cities). */
const CITY_BRANCH_ANCHOR={
  'Mirpur Khas':'Hyderabad','Larkana':'Sukkur','Quetta':'Sukkur','Dera Ghazi Khan':'Multan',
  'Vehari':'Multan','Kasur':'Lahore','Sheikhupura':'Lahore','Faisalabad':'Lahore','Sargodha':'Lahore',
  'Sialkot':'Gujranwala','Abbottabad':'Islamabad','Kohat':'Peshawar','Mardan':'Peshawar','Gwadar':'Karachi'
};
function cityDisplayPos(city){
  if(CITY_MAINLINE_POS[city]!=null)return CITY_MAINLINE_POS[city];
  const anchor=CITY_BRANCH_ANCHOR[city];
  return anchor!=null?CITY_MAINLINE_POS[anchor]:999;
}
function suggestStationsBetween(from,to){
  const a=cityDisplayPos(from),b=cityDisplayPos(to);
  if(a===999||b===999)return [];
  const lo=Math.min(a,b),hi=Math.max(a,b);
  return Object.keys(CITY_MAINLINE_POS).filter(c=>c!==from&&c!==to&&CITY_MAINLINE_POS[c]>lo&&CITY_MAINLINE_POS[c]<hi)

/* Not cryptographically strong — this app has no backend, so this is a soft client-side gate
   (deters casual access, keeps plaintext out of localStorage/JSON backups) not real security. */
function simpleHash(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}
  return (h>>>0).toString(16);
}

function migrateDB(){
  let dirty=false;
  const t=nowISO();
  const stamp=(o)=>{o.created_at=t;o.updated_at=t;o.created_by='seed';o.updated_by='seed';o.deleted_at=null;return o;};
  COLLS.forEach(c=>{if(!db[c]){db[c]=[];dirty=true;}});
  (()=>{
    const haveCodes=db.chart_of_accounts.filter(r=>!r.deleted_at).map(r=>r.code);
    COA_SEED.forEach(([code,name,type,isControl])=>{
      if(!haveCodes.includes(code)){
        db.chart_of_accounts.push(stamp({id:nextId('chart_of_accounts'),code:code,name:name,type:type,is_control:isControl}));
        dirty=true;
      }
    });
  })();
  if(!db.listopts.filter(r=>!r.deleted_at).length){
    Object.keys(DEFAULT_LISTS).forEach(k=>DEFAULT_LISTS[k].forEach(v=>{
      db.listopts.push(stamp({id:nextId('listopts'),kind:k,value:v}));
    }));
    dirty=true;
  }
  // v4: append any new default cities not yet in the list
  const haveCities=db.listopts.filter(r=>r.kind==='city'&&!r.deleted_at).map(r=>r.value);
  DEFAULT_LISTS.city.forEach(v=>{
    if(!haveCities.includes(v)){db.listopts.push(stamp({id:nextId('listopts'),kind:'city',value:v}));dirty=true;}
  });
  // v4: seed major Pakistani auto manufacturers as customers (skip existing names)
  const haveCust=db.customers.filter(r=>!r.deleted_at).map(r=>r.name.toLowerCase());
  MAJOR_OEMS.forEach(n=>{
    if(!haveCust.includes(n.toLowerCase())){
      db.customers.push(stamp({id:nextId('customers'),name:n,plant:'',delivery_points:'',billing_contact:'',ops_contact:''}));
      dirty=true;
    }
  });
  // v4: default cash/bank accounts + GL chart
  const haveAcctNames=db.accounts.filter(r=>!r.deleted_at).map(r=>r.name.toLowerCase());
  const DEFAULT_ACCTS=[
    ['1010','Cash in Hand','cash'],['1020','Bank Account','bank'],
    // Assets
    ['1030','Petty Cash','cash'],['1200','Accounts Receivable - Customers','bank'],['1210','Accounts Receivable - Carriers','bank'],
    ['1300','Equipment & Vehicles','bank'],['1310','Accumulated Depreciation','bank'],
    // Liabilities
    ['2010','Accounts Payable - Carriers','bank'],['2020','Accounts Payable - Vendors','bank'],['2030','Accrued Expenses','bank'],['2100','Short-term Loan','bank'],
    // Equity
    ['3000','Capital Account','bank'],['3100','Retained Earnings','bank'],['3200','Drawing Account','bank'],
    // Income
    ['4010','Transport Revenue - Freight','bank'],['4020','Transport Revenue - Parcels','bank'],['4030','Commission Income','bank'],['4040','Handling Charges Income','bank'],
    // Expenses
    ['5010','Fuel & Diesel Expense','bank'],['5020','Driver Salary','bank'],['5030','Vehicle Maintenance','bank'],['5040','Insurance Premium','bank'],
    ['5050','Toll Tax Expense','bank'],['5060','Rent Expense','bank'],['5070','Utilities Expense','bank'],['5080','Depreciation Expense','bank'],
    ['5090','Office Supplies','bank'],['5100','Miscellaneous Expense','bank']
  ];
  DEFAULT_ACCTS.forEach(([code,name,type])=>{
    if(!haveAcctNames.includes(name.toLowerCase())){
      db.accounts.push(stamp({id:nextId('accounts'),code:code,name:name,type:type,opening_paisa:0}));
      dirty=true;
    }
  });
  // v4: vendor category rename
  db.vendors.forEach(v=>{
    if(v.category==='repair'){v.category='repairs';dirty=true;}
  });
  // v4.17: Oil + Filter merged back into one Engine Oil & Filter category
  db.vendors.forEach(v=>{
    if(v.category==='oil'||v.category==='filter'){v.category='oil_filter';dirty=true;}
  });
  // v4: old expense types — diesel rows become fuel entries; others remapped
  db.expenses.forEach(e=>{
    if(e.deleted_at)return;
    if(e.type==='diesel'){
      db.fuel.push(stamp({id:nextId('fuel'),date:e.date,journey_id:null,pump:e.location||'',
        litres:e.qty||null,total_paisa:e.amount_paisa,account_id:e.account_id||null,notes:'Migrated from expenses'}));
      e.deleted_at=t;dirty=true;
    }else if(e.type==='toll'){e.type='toll_tax';dirty=true;}
    else if(e.type==='extra_delivery'){e.type='other';dirty=true;}
  });
  // v4.4: every bilty must ride on a Trip — auto-wrap legacy bilties that carry expenses directly but no Trip
  if(!db.seq.tripno)db.seq.tripno=0;
  const orphanTripIds=new Set();
  db.expenses.forEach(e=>{if(!e.deleted_at&&e.trip_id&&!e.journey_id)orphanTripIds.add(e.trip_id);});
  orphanTripIds.forEach(tid=>{
    const tr=db.trips.find(x=>x.id===tid&&!x.deleted_at);
    if(!tr||tr.journey_id)return;
    const parts=(tr.route||'').split('→').map(x=>x.trim());
    const j=stamp({id:nextId('journeys'),trip_no:'TRIP-'+new Date().getFullYear()+'-'+String((db.seq.tripno=(db.seq.tripno||0)+1)).padStart(4,'0'),
      date:tr.date,carrier_id:tr.carrier_id||null,driver_id:tr.driver_id||null,
      route_from:parts[0]||tr.route||'',route_to:parts[1]||'',stations:[],
      status:(tr.status==='delivered'||tr.status==='closed')?'finished':'open',date_end:null,carrier_log:[],
      notes:'Auto-created to hold legacy bilty '+tr.bilty_no});
    db.journeys.push(j);
    tr.journey_id=j.id;tr.load_from=j.route_from;tr.load_to=j.route_to;tr.updated_at=t;tr.updated_by='seed';
    db.expenses.forEach(e=>{if(!e.deleted_at&&e.trip_id===tid&&!e.journey_id)e.journey_id=j.id;});
    dirty=true;
  });
  // v4.18: a Trip cannot stay deleted while expenses/fuel still point to it — restore it so those records reattach
  const liveRefs=new Set();
  db.expenses.forEach(e=>{if(!e.deleted_at&&e.journey_id)liveRefs.add(e.journey_id);});
  db.fuel.forEach(f=>{if(!f.deleted_at&&f.journey_id)liveRefs.add(f.journey_id);});
  liveRefs.forEach(jid=>{
    const j=db.journeys.find(x=>x.id===jid);
    if(j&&j.deleted_at){j.deleted_at=null;j.updated_at=t;j.updated_by='seed';dirty=true;}
  });
  // v4.24: Rate Agreement route split into From/To city fields
  db.agreements.forEach(a=>{
    if(a.deleted_at||a.route_from)return;
    const parts=(a.route||'').split('→').map(x=>x.trim()).filter(Boolean);
    a.route_from=parts[0]||''; a.route_to=parts[1]||'';
    dirty=true;
  });
  if(dirty)saveDB();
  /* Bilties saved before clearing charges were raised automatically kept the agent and cost as
     reference only, so nothing ever reached Payables. Create the missing charge once for each,
     rather than making every one of them be re-saved by hand. */
  (()=>{
    if(!db.chart_of_accounts.filter(r=>!r.deleted_at).length)return;
    let made=0;
    all('trips').forEach(t=>{
      if(t.agent_id==null||!(t.agent_cost_paisa>0))return;
      if(all('agentcharges').some(x=>x.trip_id===t.id))return;
      const rec=add('agentcharges',{agent_id:t.agent_id,trip_id:t.id,charge_type:'misc',
        direction:'payable',amount_paisa:t.agent_cost_paisa,date:t.date,auto_from_bilty:true});
      postSubEntry('agentcharges',rec);
      made++;
    });
    if(made)console.info('Created '+made+' clearing charge(s) from bilties that had an agent but no charge.');
  })();
}

function coaByCode(code){return all('chart_of_accounts').find(a=>a.code===code);}
function postEntry(eventType,sourceType,sourceId,lines,memo,entryDate){
  const totalDr=lines.reduce((s,l)=>s+(l.debit_paisa||0),0);
  const totalCr=lines.reduce((s,l)=>s+(l.credit_paisa||0),0);
  if(totalDr===0&&totalCr===0)return null;
  /* A lopsided entry should never silently vanish. Park the difference in Suspense so it shows
     up on the Trial Balance and Balances screen as something to investigate, and say so out loud. */
  if(totalDr!==totalCr){
    const diff=totalDr-totalCr;
    lines=lines.concat([diff>0
      ?{account_code:'9999',debit_paisa:0,credit_paisa:diff}
      :{account_code:'9999',debit_paisa:-diff,credit_paisa:0}]);
    console.error('postEntry: unbalanced',eventType,totalDr,totalCr);
    if(typeof toast==='function')toast('Something didn\'t add up on this entry — '+pkr(Math.abs(diff))+' parked in Suspense. Check Balances.',true);
  }
  const entry=add('journal_entries',{event_type:eventType,date:entryDate||today(),source_type:sourceType,source_id:sourceId,memo:memo||'',reversed_of_id:null});
  lines.forEach(l=>{
    const acct=coaByCode(l.account_code);
    add('journal_lines',{entry_id:entry.id,account_id:acct?acct.id:null,account_code:l.account_code,
      subsidiary_type:l.subsidiary_type||null,subsidiary_id:l.subsidiary_id||null,
      debit_paisa:l.debit_paisa||0,credit_paisa:l.credit_paisa||0});
  });
  return entry.id;
}
function reverseEntry(entryId){
  if(!entryId)return null;
  const orig=byId('journal_entries',entryId); if(!orig)return null;
  const origLines=all('journal_lines').filter(l=>l.entry_id===entryId);
  if(!origLines.length)return null;
  const rev=add('journal_entries',{event_type:orig.event_type,date:today(),source_type:orig.source_type,source_id:orig.source_id,memo:'Reversal of #'+entryId,reversed_of_id:entryId});
  origLines.forEach(l=>{
    add('journal_lines',{entry_id:rev.id,account_id:l.account_id,account_code:l.account_code,
      subsidiary_type:l.subsidiary_type,subsidiary_id:l.subsidiary_id,
      debit_paisa:l.credit_paisa,credit_paisa:l.debit_paisa});
  });
  return rev.id;
}
function repostEntry(entryId,eventType,sourceType,sourceId,lines,memo,entryDate){
  if(entryId)reverseEntry(entryId);
  return postEntry(eventType,sourceType,sourceId,lines,memo,entryDate);
}
function acctBalance(code){return all('journal_lines').filter(l=>l.account_code===code).reduce((s,l)=>s+l.debit_paisa-l.credit_paisa,0);}

function yearEndPreview(){

  if(!to){el.textContent='Pick the date the year ends on.';return;}
  const d=plData(from,to);
  el.innerHTML=`Income ${pkr(d.totalIncome)} − Expenses ${pkr(d.totalExpense)} =

}
function yearEndSave(){
  const to=V('ye_date'), from=V('ye_from')||null;
  if(!to){toast('Pick the date the year ends on',true);return;}
  if(all('journal_entries').some(e=>e.event_type==='year_end_close'&&e.date===to)){
    toast('That year has already been closed',true);return;
  }
  const lines=[];
  all('chart_of_accounts').filter(a=>a.type==='income'||a.type==='expense').forEach(a=>{
    const bal=acctBalanceInRange(a.code,from,to);
    if(!bal)return;
    // clear each account back to nil: credit what carries a debit balance, and vice versa
    lines.push(bal>0
      ?{account_code:a.code,debit_paisa:0,credit_paisa:bal}
      :{account_code:a.code,debit_paisa:-bal,credit_paisa:0});
  });
  if(!lines.length){toast('Nothing to close — no income or expenses in that period',true);return;}
  const d=plData(from,to);
  lines.push(d.net>=0
    ?{account_code:'3100',debit_paisa:0,credit_paisa:d.net}
    :{account_code:'3100',debit_paisa:-d.net,credit_paisa:0});
  if(!confirm('Close the year ending '+fmtDate(to)+'?\n\n'+(d.net>=0?'Profit':'Loss')+' of '+pkr(Math.abs(d.net))
    +' moves into Owner\'s funds, and income/expense accounts restart from zero.\n\nThis can be undone.'))return;
  postEntry('year_end_close','year_end',null,lines,'Year closed — '+fmtDate(to),to);
  toast('Year closed — '+(d.net>=0?'profit':'loss')+' of '+pkr(Math.abs(d.net))+' moved into Owner\'s funds');
  closeModal();render();
}
function yearEndUndo(entryId){
  if(!confirm('Undo this year-end close? Income and expense figures for that year come back.'))return;
  reverseEntry(entryId);

}
/* Bank reconciliation: tick off the money movements that actually show on the bank's statement.
   Anything left unticked is the reason your book balance and the bank's differ — a cheque not
   yet cleared, a charge the bank took that you haven't recorded, or something genuinely missed. */
function bankRecForm(){
  if(!can('finance')){toast('Not permitted',true);return;}
  const accts=all('accounts');
  if(!accts.length){toast('Add a cash or bank account first',true);return;}
  const mon=today().slice(0,7);
  openModal(`<h2>Bank Reconciliation</h2>
  <div class="small mut" style="margin-bottom:10px">Tick every line that appears on your bank statement for this period. Whatever stays unticked explains the gap between your books and the bank.</div>
  <div class="fgrid" style="margin-bottom:10px">
    <div class="frow"><label class="req">Account</label><select id="br_acct" onchange="bankRecRefresh()">${accts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
    <div class="frow"><label>Up to</label><input type="date" id="br_to" value="${today()}" onchange="bankRecRefresh()"></div>
    <div class="frow"><label>Closing balance on the statement (PKR)</label><input type="number" step="0.01" id="br_stmt" oninput="bankRecCalc()"></div>
  </div>
  <div id="br_box"></div>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button>
  <button class="btn" onclick="bankRecSave()">Save ticks</button></div>`,true);
  bankRecRefresh();
}
function bankRecLines(accId,to){
  return all('journal_lines').filter(l=>{
    if(l.account_code!=='1000'||String(l.subsidiary_id)!==String(accId))return false;
    const e=byId('journal_entries',l.entry_id);
    return e&&(!to||e.date<=to);
  }).map(l=>({line:l,entry:byId('journal_entries',l.entry_id)}))
    .sort((a,b)=>a.entry.date<b.entry.date?-1:(a.entry.date>b.entry.date?1:a.line.id-b.line.id));
}
function bankRecRefresh(){
  const box=document.getElementById('br_box'); if(!box)return;
  const accId=parseInt(V('br_acct'),10), to=V('br_to');
  const rows=bankRecLines(accId,to);
  if(!rows.length){box.innerHTML='<div class="mut small">Nothing recorded on this account yet.</div>';bankRecCalc();return;}
  box.innerHTML=`<div class="tblwrap" style="margin-bottom:8px"><table><thead><tr><th>On statement</th><th>Date</th><th>What it was</th><th class="num">In</th><th class="num">Out</th></tr></thead><tbody>
  ${rows.map(r=>`<tr>
    <td><input type="checkbox" name="br_ck" value="${r.line.id}" ${r.line.reconciled_at?'checked':''} style="width:auto" onchange="bankRecCalc()"></td>
    <td>${esc(fmtDate(r.entry.date))}</td><td>${esc(r.entry.memo||r.entry.event_type)}</td>
    <td class="num">${r.line.debit_paisa?pkr(r.line.debit_paisa):''}</td>
    <td class="num">${r.line.credit_paisa?pkr(r.line.credit_paisa):''}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="suggest" id="br_summary"></div>`;
  bankRecCalc();
}
function bankRecCalc(){
  const el=document.getElementById('br_summary'); if(!el)return;
  const accId=parseInt(V('br_acct'),10), to=V('br_to');
  const acct=byId('accounts',accId);
  const rows=bankRecLines(accId,to);
  const ticked=new Set(Array.from(document.querySelectorAll('input[name="br_ck"]:checked')).map(c=>parseInt(c.value,10)));
  const net=(rs)=>rs.reduce((s,r)=>s+r.line.debit_paisa-r.line.credit_paisa,0);
  const perBooks=(acct?acct.opening_paisa||0:0)+net(rows);
  const clearedOnly=(acct?acct.opening_paisa||0:0)+net(rows.filter(r=>ticked.has(r.line.id)));
  const notTicked=rows.filter(r=>!ticked.has(r.line.id));
  const stmtRaw=V('br_stmt');
  const stmt=stmtRaw===''?null:P(stmtRaw);
  const diff=stmt==null?null:stmt-clearedOnly;
  el.innerHTML=`Balance per your books: <b>${pkr(perBooks)}</b><br>
    Of that, ticked as on the statement: <b>${pkr(clearedOnly)}</b><br>
    Not yet on the statement: <b>${pkr(perBooks-clearedOnly)}</b> across ${notTicked.length} item(s)
    ${stmt!=null?`<br><br>Statement says: <b>${pkr(stmt)}</b> — ${diff===0
      ? '<b style="color:var(--ok)">✓ reconciled, everything accounted for</b>'
      : '<b style="color:var(--danger)">off by '+pkr(Math.abs(diff))+'</b> — either a tick is missing above, or something on the statement was never recorded here (a bank charge, perhaps)'}`:''}`;
}
function bankRecSave(){
  const accId=parseInt(V('br_acct'),10), to=V('br_to');
  const rows=bankRecLines(accId,to);
  const ticked=new Set(Array.from(document.querySelectorAll('input[name="br_ck"]:checked')).map(c=>parseInt(c.value,10)));
  let n=0;
  rows.forEach(r=>{
    const want=ticked.has(r.line.id)?(r.line.reconciled_at||nowISO()):null;
    if((r.line.reconciled_at||null)!==(want||null)){upd('journal_lines',r.line.id,{reconciled_at:want});n++;}
  });
  toast(n?n+' line(s) updated':'Nothing changed');
  closeModal();render();
}

function acctBalanceBySubsidiary(code,subType){
  const map=new Map();
  all('journal_lines').filter(l=>l.account_code===code&&l.subsidiary_type===subType).forEach(l=>{
    map.set(l.subsidiary_id,(map.get(l.subsidiary_id)||0)+l.debit_paisa-l.credit_paisa);
  });
  return map;
}
function balCard(map,nameFn,flip){
  if(!map.size)return '<div class="mut small">Nothing recorded yet.</div>';
  const rows=Array.from(map.entries()).map(([id,bal])=>[id,flip?-bal:bal]).filter(([,b])=>Math.abs(b)>=1);
  if(!rows.length)return '<div class="mut small">All settled — nothing outstanding.</div>';
  rows.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  return rows.map(([id,bal])=>`<div class="rowline"><span class="mut">${esc(nameFn(id))}</span><span><b>${pkr(bal)}</b></span></div>`).join('');
}

function glAcctSave(){
  const code=V('glAcctCode'),name=V('glAcctName'),type=V('glAcctType'),desc=V('glAcctDesc');
  if(!code||!name||!type){toast('Fill all fields',true);return;}
  const editId=V('glAcctEdit');
  if(editId){
    upd('accounts',editId,{code,name,type,description:desc});
  }else{
    add('accounts',{code,name,type,description:desc});
  }
  setV('glAcctEdit','');setV('glAcctCode','');setV('glAcctName','');setV('glAcctType','');setV('glAcctDesc','');
  toast('GL Account saved');render();

function glAcctDel(id){
  if(!confirm('Delete this GL Account?'))return;
  softDel('accounts',id);

  toast('GL Account deleted');render();
}

  if(v===''||v==null)return null;

function pkr(p){if(p==null)return '—';return 'Rs '+(p/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

/* Amount-in-words for the Sales Tax Invoice, matching UTN's real invoices exactly (verified
   against an issued IMC invoice: 116,960.75 paisa → "Rupees One Hundred Sixteen Thousand Nine
   Hundred Sixty and Paisa Seventy Five only.") — Western thousand/million scale, not Lakh/Crore,
   since that's the convention already on file with customers. */
function numToWordsEN(n){
  if(n===0)return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function threeDigits(x){
    let s='';
    if(x>=100){s+=ones[Math.floor(x/100)]+' Hundred ';x%=100;}
    if(x>=20){s+=tens[Math.floor(x/10)]+' ';x%=10;}
    if(x>0)s+=ones[x]+' ';
    return s.trim();
  }
  let rem=n;
  const billions=Math.floor(rem/1e9); rem%=1e9;
  const millions=Math.floor(rem/1e6); rem%=1e6;
  const thousands=Math.floor(rem/1e3); rem%=1e3;
  const parts=[];
  if(billions)parts.push(threeDigits(billions)+' Billion');
  if(millions)parts.push(threeDigits(millions)+' Million');
  if(thousands)parts.push(threeDigits(thousands)+' Thousand');
  if(rem)parts.push(threeDigits(rem));
  return parts.join(' ').trim();
}
function amountInWordsPKR(paisaAmt){
  const rupees=Math.floor(Math.abs(paisaAmt||0)/100), paisa=Math.round(Math.abs(paisaAmt||0)%100);
  let words='Rupees '+(rupees>0?numToWordsEN(rupees):'Zero');
  if(paisa>0)words+=' and Paisa '+numToWordsEN(paisa);
  return words+' only.';
}
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(d){
  if(!d)return '—';
  const s=d.length>10?d.slice(0,10):d;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m)return s;
  return m[3]+'-'+MONTH_NAMES[parseInt(m[2],10)-1]+'-'+m[1];
}
/* compact form for dense list tables only — never use on printed documents or detail views,
   which keep the full fmtDate() for the record */
function fmtDateShort(d){
  if(!d)return '—';
  const s=d.length>10?d.slice(0,10):d;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m)return s;
  return m[3]+'-'+MONTH_NAMES[parseInt(m[2],10)-1].slice(0,3)+'-'+m[1].slice(2);
}

function csvImport(inp){
  const f=inp.files[0]; if(!f)return;
  const isExcel=/\.(xlsx|xls)$/i.test(f.name);
  const r=new FileReader();
  if(isExcel){
    r.onload=()=>{
      if(typeof XLSX==='undefined'){toast('Excel reader failed to load — check your internet connection and try again, or upload a .csv instead',true);return;}
      let rows;
      try{
        const wb=XLSX.read(r.result,{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''});
      }catch(e){toast('Could not read that Excel file: '+e.message,true);return;}
      processAgreementRows(rows.map(row=>row.map(c=>String(c==null?'':c).trim())).filter(row=>row.some(c=>c!=='')));
    };
    r.readAsArrayBuffer(f);
  }else{
    r.onload=()=>{
      const lines=String(r.result).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      processAgreementRows(lines.map(l=>l.split(',').map(x=>x.trim())));
    };
    r.readAsText(f);
  }
}
function processAgreementRows(rows){
  if(!rows.length){toast('Empty file',true);return;}
  const head=rows[0].join(',').toLowerCase().replace(/\s/g,'');
  if(head.indexOf('customer')!==0){toast('First row must be the header: customer,route,vehicle_type,rate,valid_from,valid_to',true);return;}
  let skip=[], parsed=[];
  for(let i=1;i<rows.length;i++){
    const c=rows[i];
    if(c.length<6){skip.push('row '+(i+1)+': needs 6 columns');continue;}
    const cust=all('customers').find(x=>x.name.toLowerCase()===c[0].toLowerCase());
    if(!cust){skip.push('row '+(i+1)+': unknown customer "'+c[0]+'"');continue;}
    const rate=P(c[3]);
    if(rate==null){skip.push('row '+(i+1)+': bad rate "'+c[3]+'"');continue;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(c[4])||!/^\d{4}-\d{2}-\d{2}$/.test(c[5])){skip.push('row '+(i+1)+': dates must be YYYY-MM-DD (got "'+c[4]+'" / "'+c[5]+'")');continue;}
    const routeParts=c[1].split('→').map(x=>x.trim()).filter(Boolean);
    if(routeParts.length!==2){skip.push('row '+(i+1)+': route must be "From → To", e.g. "Karachi → Lahore"');continue;}
    parsed.push({customer_id:cust.id,route:c[1],route_from:routeParts[0],route_to:routeParts[1],
      vehicle_type:(c[2]||'').trim(),rate_paisa:rate,valid_from:c[4],valid_to:c[5]});
  }
  const dupes=[];
  parsed.forEach(p=>{
    const existing=all('agreements').find(a=>a.status==='active'&&a.customer_id===p.customer_id
      &&(a.route_from||'').toLowerCase()===p.route_from.toLowerCase()
      &&(a.route_to||'').toLowerCase()===p.route_to.toLowerCase()
      &&(a.vehicle_type||'').trim().toLowerCase()===p.vehicle_type.toLowerCase());
    if(existing)dupes.push({existing,p});
  });
  let replaceOld=false;
  if(dupes.length){
    replaceOld=confirm(dupes.length+' row(s) in this file match an existing ACTIVE rate for the same route + vehicle type '
      +'(e.g. '+dupes[0].existing.route+' — '+(dupes[0].existing.vehicle_type||'—')+', currently '+pkr(dupes[0].existing.rate_paisa)+').\n\n'
      +'Remove those old rates so only the new rate applies going forward? A backup CSV of the old rates will download automatically first.\n'
      +'(Trips already using the old rate are not affected — freight already posted never changes.)\n\n'
      +'OK = remove old rates (backed up) · Cancel = keep both active');
    if(replaceOld){
      retireAgreementsBackup(dupes.map(d=>d.existing));
      dupes.forEach(d=>softDel('agreements',d.existing.id));
    }
  }
  parsed.forEach(p=>add('agreements',Object.assign({fuel_clause:'',status:'active'},p)));
  toast(parsed.length+' agreement(s) imported'+(skip.length?', '+skip.length+' skipped':'')
    +(dupes.length?', '+dupes.length+' old rate(s) '+(replaceOld?'removed (backup downloaded)':'left active alongside the new ones'):''));
  if(skip.length)alert('Skipped rows:\n'+skip.join('\n'));
  render();
}
function retireAgreementsBackup(list){

  a.download='retired-rate-agreements-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
}
function monthsAgoDate(n){
  const d=new Date(today()+'T00:00:00');
  d.setMonth(d.getMonth()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* A route/vehicle can accumulate many overlapping active rate agreements over time (a new sheet
   every week or two). The most recent one is always kept, no matter how old — that's the one
   auto-fill needs for new bookings. Only the ones it has already superseded, and that are older
   than the chosen cutoff, are offered up for retirement — a booking dated inside an older window
   still needs its own rate to auto-fill correctly, so nothing gets touched until it's genuinely
   past the point anyone would still be entering a bilty for it. */
function supersededOldAgreements(cutoffDate){
  const active=all('agreements').filter(a=>a.status==='active');
  const groups=new Map();
  active.forEach(a=>{
    const key=[a.customer_id,(a.route_from||'').toLowerCase(),(a.route_to||'').toLowerCase(),(a.vehicle_type||'').trim().toLowerCase()].join('|');
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(a);
  });
  const toRetire=[];
  groups.forEach(list=>{
    if(list.length<2)return;
    list.sort((a,b)=>a.valid_from<b.valid_from?1:-1);
    list.slice(1).forEach(a=>{if(a.valid_from<cutoffDate)toRetire.push(a);});
  });
  return toRetire.sort((a,b)=>a.valid_from<b.valid_from?-1:1);
}

function agreementsCleanupRun(){

  retireAgreementsBackup(list);

function expiryBadge(dates){
  const valid=dates.filter(Boolean);
  if(!valid.length)return '<span class="mut small">—</span>';
  const now=today(), in30=new Date(new Date(now).getTime()+30*86400000).toISOString().slice(0,10);
  if(valid.some(d=>d<now))return '<span class="badge b-red">Expired</span>';
  if(valid.some(d=>d<=in30))return '<span class="badge b-amber">Expiring soon</span>';
  return '<span class="badge b-green">Valid</span>';
}
function carrierLatestOdometer(carrierId){
  const jids=new Set(all('journeys').filter(j=>j.carrier_id===carrierId).map(j=>j.id));
  const readings=all('fuel').filter(f=>jids.has(f.journey_id)&&f.odometer_km!=null)
    .slice().sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  return readings.length?{km:readings[0].odometer_km,date:readings[0].date}:null;
}
function fleetExpiringCount(){
  const now=today(), in30=new Date(new Date(now).getTime()+30*86400000).toISOString().slice(0,10);
  let n=0;
  all('carriers').forEach(c=>{
    const ds=[c.reg_expiry,c.route_permit_expiry,c.fitness_expiry,c.insurance_expiry,c.token_tax_expiry].filter(Boolean);
    if(ds.some(d=>d<=in30))n++;
  });
  all('drivers').forEach(d=>{if(d.license_expiry&&d.license_expiry<=in30)n++;});
  return n;
}
function maintenanceLevel(rec){
  const hasDate=!!rec.next_service_date, hasKm=rec.next_service_km!=null;
  if(!hasDate&&!hasKm)return -1;
  const now=today(), in14=new Date(new Date(now).getTime()+14*86400000).toISOString().slice(0,10);
  let level=0;
  if(hasDate){
    if(rec.next_service_date<now)level=Math.max(level,2);
    else if(rec.next_service_date<=in14)level=Math.max(level,1);
  }
  if(hasKm){
    const odo=carrierLatestOdometer(rec.id);
    if(odo){
      if(odo.km>=rec.next_service_km)level=Math.max(level,2);
      else if(odo.km>=rec.next_service_km-500)level=Math.max(level,1);
    }
  }
  return level;
}
function maintenanceBadge(rec){
  const level=maintenanceLevel(rec);
  if(level<0)return '<span class="mut small">—</span>';
  if(level===2)return '<span class="badge b-red">Service due</span>';
  if(level===1)return '<span class="badge b-amber">Due soon</span>';
  return '<span class="badge b-green">OK</span>';
}
function cellVal(rec,col){
  const t=col[2];
  if(t&&t[0]==='expiry')return expiryBadge(t[1].map(k=>rec[k]));
  if(t&&t[0]==='maint')return maintenanceBadge(rec);
  const v=rec[col[0]];
  if(!t)return esc(v==null||v===''?'—':v);
  if(t[0]==='money')return esc(pkr(v));
  if(t[0]==='date')return esc(fmtDate(v));
  if(t[0]==='enum')return esc(enumLbl(t[1],v));
  if(t[0]==='fk')return esc(nm(t[1],v));
  if(t[0]==='citylist')return Array.isArray(v)&&v.length?esc(v.join(' · ')):'<span class="mut small">any / not set</span>';
  return esc(v);
}

/* Deleting a Cash & Bank account is riskier than most master data — every payment, expense,
   fuel fill-up and opening balance carries an account_id, and the ledger itself references it
   as a subsidiary on account 1000. Block it while any of that exists rather than let historical
   records silently point at a name that's disappeared from the app. */
function acctDel(id){
  if(!can('master')){toast('Not permitted',true);return;}
  const acc=byId('accounts',id); if(!acc)return;
  const used=all('inpayments').some(p=>p.account_id===id)
    ||all('outpayments').some(p=>p.account_id===id)
    ||all('expenses').some(e=>e.account_id===id)
    ||all('fuel').some(f=>f.account_id===id)
    ||all('contras').some(c=>c.from_account_id===id||c.to_account_id===id)
    ||!!(acc.opening_paisa)||!!acc.journal_entry_id;
  if(used){toast('"'+acc.name+'" has transactions or an opening balance recorded against it — it can\'t be deleted while that history exists.',true);return;}
  if(!confirm('Delete "'+acc.name+'"? It has no transactions recorded, so nothing else is affected.'))return;
  softDel('accounts',id);toast('Account deleted');render();
}

function carrierAdvanceRows(cid){

  trips.forEach(j=>{

      rows.push({date:a.date,trip_no:j.trip_no,desc:'Advance given — '+advSourceRaw(a)+(a.notes?' — '+a.notes:''),amount:a.amount_paisa});
    });
    jExpenses(j.id).filter(e=>e.type!=='driver_advance').forEach(e=>{
      rows.push({date:e.date,trip_no:j.trip_no,desc:enumLbl(EXP_TYPE,e.type)+(e.location?' — '+e.location:''),amount:-(e.amount_paisa||0)});
    });

  rows.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  let bal=0;
  rows.forEach(r=>{bal+=r.amount;r.balance=bal;});

/* warehouse stock management */
function getStockBalance(itemId,locId){
  const trans=all('stock_transactions').filter(t=>t.stock_item_id===itemId&&t.stock_location_id===locId);
  return trans.reduce((sum,t)=>{
    if(t.type==='purchase'||t.type==='transfer_in')return sum+t.quantity;
    if(t.type==='consumption'||t.type==='transfer_out'||t.type==='scrap')return sum-t.quantity;
    return sum;
  },0);
}
function getStockValue(itemId,locId){
  const item=byId('stock_items',itemId);
  const balance=getStockBalance(itemId,locId);
  return balance*(item.unit_cost_paisa||0);
}
function pageWarehouse(){
  const items=all('stock_items').slice().sort((a,b)=>a.name.localeCompare(b.name));
  const locs=all('stock_locations').slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="pagehead"><h1>Warehouse Stock</h1><div class="sp"></div>
    <button class="btn" onclick="stockItemForm()">+ Add Item</button></div>
  <div class="card">
    <h2>Stock Levels by Location</h2>
    ${locs.map(loc=>{
      const locBalance=items.reduce((sum,it)=>sum+getStockBalance(it.id,loc.id),0);
      return `<div class="rowline"><span><b>${esc(loc.name)}</b> (${loc.city})</span>
        <span class="num">${locBalance.toFixed(0)} units · Rs ${pkr(items.reduce((sum,it)=>sum+getStockValue(it.id,loc.id),0))}</span></div>`;
    }).join('')}
  </div>
  ${items.map(it=>`<div class="card">
    <h3>${esc(it.name)} (${esc(it.unit)})</h3>
    <div class="tblwrap"><table><thead><tr><th>Location</th><th class="num">On-Hand</th><th class="num">Value</th><th class="num">Reorder Point</th><th></th></tr></thead><tbody>
    ${locs.map(loc=>{
      const bal=getStockBalance(it.id,loc.id);
      const val=getStockValue(it.id,loc.id);
      const lowStock=bal<it.reorder_point;
      return `<tr ${lowStock?'style="background:#fff3cd"':''}>
        <td>${esc(loc.name)}</td>
        <td class="num">${bal.toFixed(1)}</td>
        <td class="num">${pkr(val)}</td>
        <td class="num">${it.reorder_point} ${lowStock?'<span class="badge b-warn">LOW</span>':''}</td>
        <td class="num"><button class="btn ghost sm" onclick="stockTransForm(${it.id},${loc.id})">Add</button></td>
      </tr>`;
    }).join('')}
    </tbody></table></div>
    <div style="margin-top:8px"><button class="btn ghost sm" onclick="entForm('stock_items',${it.id})">Edit Item</button>
    <button class="btn ghost sm" onclick="entDel('stock_items',${it.id})">Delete</button></div>
  </div>`).join('')}`;
}

function stockTransSave(itemId,locId){
  const type=V('st_type'),qty=parseFloat(V('st_qty')||0),ref=V('st_ref'),notes=V('st_notes');
  if(qty<=0){toast('Quantity required',true);return;}
  const obj={stock_item_id:itemId,stock_location_id:locId,type,quantity:qty,date:today(),reference:ref,notes,

  add('stock_transactions',obj);

/* dropdown lists — grouped by kind so the list name isn't repeated on every row */
function pageListOpts(){
  const E=ENTITIES.listopts;
  const byKind=new Map();
  LIST_KINDS.forEach(k=>byKind.set(k[0],[]));
  all('listopts').forEach(r=>{
    if(!byKind.has(r.kind))byKind.set(r.kind,[]);
    byKind.get(r.kind).push(r);
  });
  window._loExpanded=window._loExpanded||new Set();
  const groups=Array.from(byKind.entries()).map(([kind,list])=>({
    kind,label:(LIST_KINDS.find(k=>k[0]===kind)||[kind,kind])[1],
    items:list.slice().sort((a,b)=>a.value.localeCompare(b.value))

  return `<div class="pagehead"><h1>${esc(E.title)}</h1><div class="sp"></div>
    <button class="btn" onclick="entForm('listopts')">+ Add ${esc(E.sing)}</button></div>
  ${groups.map(g=>{
    const expanded=window._loExpanded.has(g.kind);
    let html=`<div class="card" style="margin-bottom:10px">
      <div class="rowline" style="cursor:pointer" onclick="loToggle('${g.kind}')">
        <span><b>${expanded?'▾':'▸'} ${esc(g.label)}</b> <span class="badge b-gray">${g.items.length} value${g.items.length===1?'':'s'}</span></span>
        ${expanded?`<button class="btn ghost sm" onclick="event.stopPropagation();entForm('listopts',null,{kind:'${g.kind}'})">+ Add value</button>`:''}
      </div>`;
    if(expanded){
      html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
        ${g.items.length>8?`<div class="frow" style="margin-bottom:10px;max-width:260px"><input placeholder="Filter values…" oninput="loFilterRows('${g.kind}',this.value)"></div>`:''}
        <div class="tblwrap"><table><thead><tr><th>Value</th><th></th></tr></thead>
        <tbody id="lo_tbody_${g.kind}">${g.items.length?g.items.map(r=>`<tr data-value="${esc(r.value.toLowerCase())}">
          <td>${esc(r.value)}${r.customer_id?` <span class="badge b-gray">${esc(nm('customers',r.customer_id))}</span>`:''}</td>

        </tr>`).join(''):`<tr><td colspan="2"><div class="empty">No values yet.</div></td></tr>`}
        </tbody></table></div>
      </div>`;
    }
    html+='</div>';
    return html;

function loToggle(kind){

/* Several agreements can match the same route + date once a tier has been repriced more than
   once and old versions were kept active instead of retired (rate sheets arrive almost weekly
   for some clients). Group by vehicle type and keep only each tier's most recent applicable
   version — comparing DISTINCT PRICES to decide "one match vs. pick a tier" breaks the moment a
   single tier has been repriced, since every historical price counts as a different one. Only a
   genuine difference in vehicle type should ever prompt a manual pick. */
function collapseAgreementsByTier(matches){
  const byTier=new Map();
  matches.forEach(m=>{
    const key=(m.vehicle_type||'').trim().toLowerCase();
    const cur=byTier.get(key);
    if(!cur||m.valid_from>cur.valid_from)byTier.set(key,m);
  });
  return Array.from(byTier.values());
}
/* Different destinations often clear through different agents (a Lahore agent isn't necessarily
   who handles Peshawar). An agent only gets suggested for a city once someone's told the app it
   handles that city — see Clearing Agents' "Destinations this agent handles" field. Nothing
   suggested here (empty array) if no agent has that city set, same as today — never blocks
   picking one by hand. */
function agentsForCity(city){
  if(!city)return [];
  const c=city.toLowerCase();
  return all('agents').filter(a=>Array.isArray(a.cities)&&a.cities.some(x=>x.toLowerCase()===c));
}
/* Clearing-agent <select> options grouped by whether the agent's master-data "cities" cover the
   given destination — matches first so the common case needs no scrolling, but every agent stays
   pickable below since the cities list is manual data entry and may be incomplete or need an
   exception. */
function agentOptions(city,sel){
  const matches=agentsForCity(city);
  let html='<option value="">—</option>';
  if(!matches.length)return html+fkOptions('agents',sel).replace('<option value="">—</option>','');
  const matchIds=new Set(matches.map(a=>a.id));
  const rest=all('agents').filter(a=>!matchIds.has(a.id));
  const opt=a=>`<option value="${a.id}" ${String(sel)===String(a.id)?'selected':''}>${esc(a.name)}</option>`;
  html+=`<optgroup label="Serves ${esc(city)}">${matches.map(opt).join('')}</optgroup>`;
  if(rest.length)html+=`<optgroup label="All agents">${rest.map(opt).join('')}</optgroup>`;
  return html;
}
function bkRateSuggest(){
  const box=document.getElementById('bkSuggestBox'); if(!box)return;
  window._bkSuggest=null;
  const openMkt=document.getElementById('b_open_market')&&document.getElementById('b_open_market').checked;
  const showPrice=can('viewFreight');
  if(openMkt){box.innerHTML='';return;}
  const cid=parseInt(V('b_customer'),10)||null, from=V('b_from'), to=V('b_dest'), dt=V('b_date')||today();
  if(!cid||!from||!to){box.innerHTML='';return;}
  const matches=all('agreements').filter(a=>a.status==='active'&&a.customer_id==cid
    &&(a.route_from||'').toLowerCase()===from.toLowerCase()
    &&(a.route_to||'').toLowerCase()===to.toLowerCase()
    &&a.valid_from<=dt&&a.valid_to>=dt);
  if(!matches.length){
    box.innerHTML=showPrice
      ?'<div class="hint">No active rate agreement matches this From → Destination — enter freight manually.</div>'
      :'<div class="hint">No active rate agreement matches this route. If this job has no company rate agreement, tick "Private / Open market" above.</div>';
    return;

      :`<div class="hint">Rate agreement matched — freight set automatically (visible to Admin).</div>`;
    const f=document.getElementById('b_chg_freight');

      ?`<div class="suggest">${tiers.length} rate tiers apply to this route — pick the one matching the vehicle being shipped:<br>

/* Changing a destination — a row's own, or the header default cascading into rows still following
   it — needs the old suggestion cleared first. "Only fill an empty field" is the right rule
   everywhere else, but here the field usually isn't empty, it's just filled with the WRONG city's
   rate/agent, which would otherwise sit there silently. */
function gpResuggestRow(rid){
  const fr=document.getElementById('gp_freight_'+rid), agSel=document.getElementById('gp_agent_'+rid), agCost=document.getElementById('gp_agentcost_'+rid);
  if(fr)fr.value='';

}

/* The header's Default destination changes: push it into every row that's still following it
   (new rows, and any row whose own destination was never touched by hand) so filling in the
   header first — the natural order, since it's laid out above the table — actually reaches them,
   instead of leaving rows stuck on whatever arbitrary city they had at creation. */
function gpHeaderDestChanged(){
  const dest=V('gp_dest');

function gpRowSuggest(rid){

  const fr=document.getElementById('gp_freight_'+rid), sg=document.getElementById('gp_sg_'+rid);
  const agSel=document.getElementById('gp_agent_'+rid), agBox=document.getElementById('gp_ag_'+rid);
  if(!fr||!sg)return;
  const showPrice=can('viewFreight');
  const dest=V('gp_dest_'+rid);

  // --- freight, matched against THIS row's own destination ---
  if(openMkt){fr.style.display='';sg.innerHTML='';sg.style.display='none';}
  else{
    fr.style.display=showPrice?'':'none'; sg.style.display='';
    const cid=parseInt(V('gp_customer'),10)||null, from=V('gp_from'), dt=V('gp_date')||today();
    let tiers=[];
    if(cid&&from&&dest){
      const matches=all('agreements').filter(a=>a.status==='active'&&a.customer_id==cid
        &&(a.route_from||'').toLowerCase()===from.toLowerCase()
        &&(a.route_to||'').toLowerCase()===dest.toLowerCase()
        &&a.valid_from<=dt&&a.valid_to>=dt);
      tiers=collapseAgreementsByTier(matches);
    }
    if(!tiers.length){sg.innerHTML='';}
    else if(tiers.length===1){
      const ag=tiers[0];
      window._gpAgIds[rid]=ag.id;
      if(fr.value==='')fr.value=moneyVal(ag.rate_paisa);
      sg.innerHTML=showPrice?`<span class="mut">Matched: ${esc(ag.vehicle_type||'rate')} — ${pkr(ag.rate_paisa)}</span>`:'<span class="mut">Rate applied automatically</span>';
    }else{
      const sorted=tiers.slice().sort((a,b)=>a.rate_paisa-b.rate_paisa);
      const sel=window._gpAgIds[rid]||'';
      sg.innerHTML=`<select onchange="gpRowPick(${rid},this.value)" style="width:100%;max-width:150px">
        <option value="">Pick tier…</option>
        ${sorted.map(m=>`<option value="${m.id}" ${String(sel)===String(m.id)?'selected':''}>${esc(m.vehicle_type||'Tier #'+m.id)}${showPrice?' — '+pkr(m.rate_paisa):''}</option>`).join('')}
        </select>`;
    }
  }

  // --- clearing agent, suggested for THIS row's own destination ---
  if(agSel&&agBox){
    agSel.innerHTML=agentOptions(dest,agSel.value);
    const matches=agentsForCity(dest);
    if(!matches.length){agBox.innerHTML='';}
    else if(matches.length===1){
      const ag=matches[0];
      if(!agSel.value){agSel.value=ag.id;gpAgentCostFill(rid);agBox.innerHTML=`<span class="mut">Auto: ${esc(ag.name)}</span>`;}
      else{agBox.innerHTML=`<span class="mut">${esc(ag.name)} handles this — <a href="#" onclick="document.getElementById('gp_agent_${rid}').value='${ag.id}';gpAgentCostFill(${rid});return false">use</a></span>`;}
    }else{
      agBox.innerHTML=matches.map(a=>`<a href="#" style="margin-right:6px" onclick="document.getElementById('gp_agent_${rid}').value='${a.id}';gpAgentCostFill(${rid});return false">${esc(a.name)}</a>`).join('');
    }
  }
}

/* Gemini document scanning — generic helper, reusable beyond gate passes */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror=()=>reject(new Error('Could not read file'));
    r.readAsDataURL(file);
  });
}
function geminiCandidateModels(models,exclude){
  const usable=(models||[]).filter(m=>m.supportedGenerationMethods&&m.supportedGenerationMethods.indexOf('generateContent')!==-1
    &&!/embedding|aqa|vision$|thinking|tts|-image|-audio/i.test(m.name));
  let names=usable.map(m=>m.name.replace(/^models\//,'')).filter(n=>!exclude.has(n));
  names.sort((a,b)=>{
    const af=/flash/i.test(a)?0:1, bf=/flash/i.test(b)?0:1;
    if(af!==bf)return af-bf;
    return b.localeCompare(a);
  });
  return names;
}
function geminiResolveModel(key,exclude){
  const cached=localStorage.getItem('mucrm_gemini_model');
  if(cached&&!exclude.has(cached))return Promise.resolve(cached);
  return fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key))
    .then(res=>{
      if(!res.ok)return res.text().then(t=>{throw new Error('Could not list Gemini models (HTTP '+res.status+'): '+t.slice(0,200));});
      return res.json();
    })
    .then(data=>{
      const names=geminiCandidateModels(data.models,exclude);
      if(!names.length)throw new Error('No usable Gemini model left to try for this API key — check the API key/project has the Generative Language API enabled.');
      localStorage.setItem('mucrm_gemini_model',names[0]);
      return names[0];
    });
}
function geminiExtractJSON(file,promptText){
  const key=geminiKey();
  if(!key)return Promise.reject(new Error('Set your Gemini API key in Settings & Backup first'));
  return fileToBase64(file).then(b64=>{
    const tried=new Set();
    function attempt(){
      return geminiResolveModel(key,tried).then(model=>{
        const body={
          contents:[{parts:[{text:promptText},{inline_data:{mime_type:file.type||'application/octet-stream',data:b64}}]}],
          generationConfig:{responseMimeType:'application/json'}
        };
        return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
        }).then(res=>{
          if(res.status===404){
            tried.add(model);
            if(localStorage.getItem('mucrm_gemini_model')===model)localStorage.removeItem('mucrm_gemini_model');
            if(tried.size>=6)throw new Error('Tried '+tried.size+' different Gemini models and none worked for this key — double-check the key/project setup in Google AI Studio.');
            return attempt();
          }
          /* 429 is Google's own usage cap on this API key, not an app bug — free-tier quotas are
             often per-model, so try a couple of alternates before giving up (without evicting the
             cached model the way a 404 does, since it isn't broken, just rate-limited right now). */
          if(res.status===429){
            tried.add(model);
            if(tried.size<3)return attempt();
            throw new Error('Gemini has hit its usage limit for this API key right now — that\'s Google\'s limit, not something wrong in the app. Free-tier quotas usually reset within a minute or by the next day. Check your usage/plan at ai.dev/rate-limit, or just fill this in by hand for now.');
          }
          if(!res.ok)return res.text().then(t=>{throw new Error('Gemini API error '+res.status+(t?': '+t.slice(0,300):''));});
          return res.json();
        });
      });
    }
    return attempt();
  }).then(data=>{
    const cand=data&&data.candidates&&data.candidates[0];
    const text=cand&&cand.content&&cand.content.parts&&cand.content.parts[0]&&cand.content.parts[0].text;
    if(!text)throw new Error('Gemini returned no data — the document may be unreadable or blocked');
    const cleaned=text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
    try{return JSON.parse(cleaned);}
    catch(e){throw new Error('Could not parse Gemini\'s response as JSON');}
  });
}
function gpScanDocument(inp){
  const f=inp.files[0]; if(!f)return;
  const status=document.getElementById('gpScanStatus');
  if(!geminiKey()){toast('Set your Gemini API key in Settings & Backup first',true);inp.value='';return;}
  if(status)status.innerHTML='<span class="mut small">Scanning with Gemini…</span>';
  const prompt='Extract data from this vehicle transporter gate pass document. Return ONLY JSON, no other text, in exactly this shape:\n'
    +'{"issuer_name":"","gate_pass_number":"","truck_number":"","transporter_code":"","creation_date":"YYYY-MM-DD or empty string if unclear",'
    +'"vehicles":[{"dealer_code":"","vehicle_code":"","chassis_no":"","engine_no":"","colour":""}]}\n'
    +'"issuer_name" is the company that issued this gate pass (shown in the header/logo area, e.g. an OEM like "Indus Motor Company"), '
    +'NOT the transporter/carrier company. Include one entry in "vehicles" per row of the vehicle table. Use an empty string for any field you cannot read confidently — never guess.';
  geminiExtractJSON(f,prompt).then(result=>{
    if(status)status.innerHTML='';
    if(!result||!Array.isArray(result.vehicles)||!result.vehicles.length){toast('Gemini could not find a vehicle table in this document',true);return;}
    if(result.gate_pass_number)document.getElementById('gp_gatepass').value=result.gate_pass_number;
    if(result.truck_number)document.getElementById('gp_truckno').value=result.truck_number;
    if(result.transporter_code)document.getElementById('gp_transcode').value=result.transporter_code;
    if(result.creation_date&&/^\d{4}-\d{2}-\d{2}$/.test(result.creation_date))document.getElementById('gp_date').value=result.creation_date;
    if(result.issuer_name){
      const needle=result.issuer_name.toLowerCase().replace(/\s*(limited|ltd|company|co\.?)\b/g,'').trim();
      const match=all('customers').find(c=>{
        const hay=c.name.toLowerCase().replace(/\s*\(.*?\)/g,'').replace(/\s*(limited|ltd|company|co\.?)\b/g,'').trim();
        return hay&&needle&&(hay.includes(needle)||needle.includes(hay));
      });
      if(match)document.getElementById('gp_customer').value=match.id;
      else toast('Could not match "'+result.issuer_name+'" to a customer — please pick one manually',true);
    }
    document.getElementById('gpRows').innerHTML=''; window._gpFollowDest.clear();
    result.vehicles.forEach(v=>{
      gpAddRow();
      const rid=window._gpRowSeq;
      document.getElementById('gp_consignee_'+rid).value=v.dealer_code||'';
      document.getElementById('gp_code_'+rid).value=v.vehicle_code||'';
      document.getElementById('gp_chassis_'+rid).value=v.chassis_no||'';
      document.getElementById('gp_engine_'+rid).value=v.engine_no||'';
      document.getElementById('gp_colour_'+rid).value=v.colour||'';
    });
    gpRefreshRows();
    toast(result.vehicles.length+' vehicle(s) extracted — please review every row (including destination) before saving');
  }).catch(err=>{
    if(status)status.innerHTML='';
    toast('Scan failed: '+err.message,true);
  });
  inp.value='';
}
function gpSaveAll(){
  if(!can('bookings')){toast('Not permitted',true);return;}
  const cid=parseInt(V('gp_customer'),10)||null, date=V('gp_date'), from=V('gp_from');
  if(!cid||!date||!from){toast('Consigner, date and From are required',true);return;}
  const gatePass=V('gp_gatepass'), truckNo=V('gp_truckno'), transCode=V('gp_transcode');
  const openMkt=document.getElementById('gp_open_market').checked;
  const noteParts=[gatePass?'Gate pass '+gatePass:'',truckNo?'Truck '+truckNo:'',transCode?'Transporter code '+transCode:''].filter(Boolean);
  const notesLine=noteParts.join(' — ');
  const rows=Array.from(document.querySelectorAll('#gpRows tr'));
  let created=[]; let agentChargeTotal=0;
  for(const tr of rows){
    const rid=tr.id.replace('gp_row_','');
    const dest=V('gp_dest_'+rid);
    const chassis=V('gp_chassis_'+rid);
    const consignee=V('gp_consignee_'+rid), code=V('gp_code_'+rid), engine=V('gp_engine_'+rid), colour=V('gp_colour_'+rid);
    const freightStr=V('gp_freight_'+rid);
    if(!chassis&&!consignee&&!code&&!engine&&!colour&&!freightStr)continue;
    if(!dest){toast('Row for chassis "'+(chassis||consignee||'—')+'" is missing a destination — every vehicle needs one, even within the same gate pass.',true);return;}
    const freight=P(freightStr);
    const agId=window._gpAgIds[rid]||null;
    const rowAgentId=parseInt(V('gp_agent_'+rid),10)||null;
    const rowAgentCost=P(V('gp_agentcost_'+rid));
    const bilty='UTN-'+new Date().getFullYear()+'-'+String((db.seq.bilty=(db.seq.bilty||0)+1)).padStart(4,'0');
    const b=add('bookings',{customer_id:cid,booking_date:date,requested_pickup:'',
      bilty_no:bilty,gate_pass:gatePass,route_from:from,destination:dest,consignee:consignee,
      veh_make:code,veh_chassis:chassis,veh_engine:engine,veh_condition:'',
      veh_colour:colour,veh_model:'',veh_reg:'',
      agent_id:rowAgentId,agent_cost_paisa:rowAgentCost,total_paisa:freight,status:'converted',trip_id:null});
    const trip=add('trips',{entry_mode:'digital',bilty_no:bilty,date:date,booking_id:b.id,
      customer_id:cid,route:from+' → '+dest,consigner:nm('customers',cid),consignee:consignee,consignee_address:'',
      carrier_id:null,driver_id:null,booking_time:'',return_load_type:'none',status:'booked',
      freight_paisa:freight,open_market:!!openMkt,
      rate_agreement_id:agId,rate_overridden:false,media_ref:'',
      veh_make:code,veh_type:'',veh_chassis:chassis,veh_engine:engine,
      veh_colour:colour,veh_model:'',veh_reg:'',veh_condition:'',
      agent_id:rowAgentId,agent_cost_paisa:rowAgentCost,
      notes:notesLine,journey_id:null,load_from:null,load_to:null,pay_status:'to_be_billed'});
    upd('bookings',b.id,{trip_id:trip.id});
    syncAgentChargeForTrip(trip);
    if(rowAgentId&&rowAgentCost)agentChargeTotal+=rowAgentCost;
    created.push(bilty);
  }
  if(!created.length){toast('Add at least one vehicle row with some details filled in',true);return;}
  toast(created.length+' bilty(s) created: '+created.join(', ')
    +(agentChargeTotal?' — '+pkr(agentChargeTotal)+' in clearing charges added to Payables':''));
  closeModal();render();
}
