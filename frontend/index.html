function rateSuggest(){
  const box=document.getElementById('suggestBox'); if(!box)return;
  window._suggest=null;
  const openMkt=document.getElementById('f_open_market')&&document.getElementById('f_open_market').checked;
  const showPrice=can('viewFreight');
  if(openMkt){box.innerHTML='';return;}
  const cid=parseInt(V('f_customer_id'),10)||null, route=V('f_route').toLowerCase(),
    vt=V('f_veh_type'), dt=V('f_date')||today();
  if(!cid||!route){box.innerHTML='';return;}
  const matches=all('agreements').filter(a=>a.status==='active'&&a.customer_id==cid
    &&String(a.route).toLowerCase()===route
    &&(!a.vehicle_type||!vt||a.vehicle_type===vt)
    &&a.valid_from<=dt&&a.valid_to>=dt);
  if(!matches.length){
    box.innerHTML=showPrice
      ?'<div class="hint">No active rate agreement matches — enter freight manually.</div>'
      :'<div class="hint">No active rate agreement matches. If this job has no company rate agreement, tick "Private / Open market" above.</div>';
    return;
  }
  const tiers=collapseAgreementsByTier(matches);
  if(tiers.length===1){
    const ag=tiers[0];
    window._suggest={paisa:ag.rate_paisa,agId:ag.id};
    box.innerHTML=showPrice
      ?`<div class="suggest">Suggested from agreement #${ag.id}: <b>${pkr(ag.rate_paisa)}</b>
        <span class="mut">(${esc(ag.route)}, ${esc(ag.vehicle_type||'any type')}, valid ${esc(ag.valid_from)} → ${esc(ag.valid_to)})</span>
        <button class="btn sm" onclick="useSuggest(${ag.id})">Use</button> — editable; overrides are logged.</div>
        ${matches.length>1?`<div class="warnbox">⚠ ${matches.length} rate revisions on file for this tier — using the one valid ${esc(ag.valid_from)}.</div>`:''}`
      :`<div class="hint">Rate agreement matched — freight set automatically (visible to Admin).</div>`;
    const f=document.getElementById('f_freight');
    if(f&&f.value==='')f.value=moneyVal(ag.rate_paisa);
  }else{
    tiers.sort((a,b)=>a.rate_paisa-b.rate_paisa);
    box.innerHTML=showPrice
      ?`<div class="suggest">${tiers.length} rate tiers apply — pick the one matching the vehicle:<br>
        ${tiers.map(m=>`<button class="btn ghost sm" style="margin:4px 6px 0 0" onclick="useSuggest(${m.id})">${esc(m.vehicle_type||'Rate #'+m.id)} — ${pkr(m.rate_paisa)}</button>`).join('')}
        </div>`
      :`<div class="hint">${tiers.length} vehicle tiers apply — pick the one matching the vehicle:<br>
        ${tiers.map(m=>`<button class="btn ghost sm" style="margin:4px 6px 0 0" onclick="useSuggest(${m.id})">${esc(m.vehicle_type||'Tier #'+m.id)}</button>`).join('')}
        </div>`;
  }
}
function useSuggest(agId){
  const ag=byId('agreements',agId); if(!ag)return;
  window._suggest={paisa:ag.rate_paisa,agId:ag.id};
  document.getElementById('f_freight').value=moneyVal(ag.rate_paisa);
}
function tripSave(id){
  if(!can('trips_entry')){toast('Not permitted',true);return;}
  const em=V('f_entry_mode')||(id?byId('trips',id).entry_mode:''), date=V('f_date'),
    cid=parseInt(V('f_customer_id'),10)||null, route=V('f_route');
  if(!em||!date||!cid||!route){toast('Entry mode, date, customer and route are required',true);return;}
  const prev=id?byId('trips',id):null;
  let bilty=V('f_bilty');
  if(em==='manual_logged'){
    if(!bilty){toast('Bilty no. is required for a manual-logged trip',true);return;}
  }
  // Check for duplicate vehicles (same engine+chassis)
  const vEngine=V('f_veh_engine'), vChassis=V('f_veh_chassis');
  if(vEngine&&vChassis){
    const dup=all('trips').find(t=>t.id!=id&&String(t.veh_engine).toLowerCase()===vEngine.toLowerCase()&&String(t.veh_chassis).toLowerCase()===vChassis.toLowerCase());
    if(dup&&!confirm('⚠ Same vehicle (engine '+vEngine+' / chassis '+vChassis+') already exists on bilty '+dup.bilty_no+' ('+fmtDate(dup.date)+').\n\nGate pass duplicates happen — you may proceed. Save anyway?'))return;
  }
  // Also check for duplicate bilty numbers for manual entries
  if(bilty&&em==='manual_logged'){
    const dupBilty=all('trips').find(t=>t.id!=id&&String(t.bilty_no).toLowerCase()===bilty.toLowerCase());
    if(dupBilty&&!confirm('Warning: bilty no. "'+bilty+'" already exists on trip of '+fmtDate(dupBilty.date)+' ('+dupBilty.route+').\n\nPaper errors happen — you may proceed. Save anyway?'))return;
  }
  const freight=P(V('f_freight'));
  const obj={entry_mode:em,date:date,customer_id:cid,route:route,
    consigner:V('f_consigner'),consignee:V('f_consignee'),consignee_address:V('f_consignee_addr'),
    carrier_id:parseInt(V('f_carrier_id'),10)||null,driver_id:parseInt(V('f_driver_id'),10)||null,
    booking_time:V('f_booking_time'),return_load_type:V('f_return_load')||'none',
    status:V('f_status')||'booked',freight_paisa:freight,
    open_market:!!(document.getElementById('f_open_market')&&document.getElementById('f_open_market').checked),
    media_ref:V('f_media'),
    veh_make:V('f_veh_make'),veh_type:V('f_veh_type'),veh_chassis:V('f_veh_chassis'),
    veh_engine:V('f_veh_engine'),veh_colour:V('f_veh_colour'),veh_model:V('f_veh_model'),
    veh_reg:V('f_veh_reg'),veh_condition:V('f_veh_cond'),notes:V('f_notes'),
    agent_id:parseInt(V('f_agent'),10)||null,agent_cost_paisa:P(V('f_agentcost')),
    booking_id:parseInt(V('f_booking_id'),10)||null};
  const s=window._suggest;
  obj.rate_agreement_id=s?s.agId:(prev?prev.rate_agreement_id:null);
  obj.rate_overridden=!!(s&&freight!=null&&freight!==s.paisa);
  if(em==='digital'){
    bilty=(prev&&prev.entry_mode==='digital')?prev.bilty_no
      :('UTN-'+new Date().getFullYear()+'-'+String((db.seq.bilty=(db.seq.bilty||0)+1)).padStart(4,'0'));
  }
  obj.bilty_no=bilty;
  let trip;
  if(id)trip=upd('trips',id,obj);else trip=add('trips',obj);
  if(s&&freight!=null&&freight!==s.paisa&&(!prev||prev.freight_paisa!==freight)){
    add('overrides',{trip_id:trip.id,agreement_id:s.agId,suggested_paisa:s.paisa,entered_paisa:freight,by:cuName()});
  }
  if(obj.booking_id)upd('bookings',obj.booking_id,{status:'converted',trip_id:trip.id});
  syncAgentChargeForTrip(trip);
  toast('Trip saved — bilty '+trip.bilty_no);
  goto('#/trip/'+trip.id);
}
function statusSet(id,st){
  const t=byId('trips',id);
  if(!t||!can('status')||!tripAccessible(t)){toast('Not permitted',true);return;}
  upd('trips',id,{status:st});toast('Status: '+enumLbl(TRIP_STATUS,st));render();
}
function tripDelete(id){
  const t=byId('trips',id);
  if(!t||!can('trips_entry')||!tripAccessible(t)){toast('Not permitted',true);return;}
  if(!confirm('Soft delete bilty '+t.bilty_no+'? It will be archived but remain in history.')){return;}
  softDel('trips',id);
  toast('Bilty '+t.bilty_no+' archived.');render();
}

/* ===== journeys (Trips: carrier runs with multiple loads) ===== */
function jLoads(jid){return all('trips').filter(t=>t.journey_id==jid);}
function journeyRouteSeq(j){
  const mid=(j.stations||[]).filter(s=>s&&s!==j.route_from&&s!==j.route_to);
  /* the trailing route_from is the return leg. Collapse any repeat so a trip entered with the
     same From and To reads "Karachi → Lahore → Karachi", not "... → Karachi → Karachi". */
  const seq=[j.route_from,...mid,j.route_to,j.route_from];
  return seq.filter((s,i)=>i===0||s!==seq[i-1]);
}
function journeyRouteDisplay(j){return journeyRouteSeq(j).map(esc).join(' → ');}
function journeyRouteText(j){return journeyRouteSeq(j).join(' → ');}
function jExpenses(jid){return all('expenses').filter(e=>e.journey_id==jid);}
function jDriverAdvance(jid){return jExpenses(jid).filter(e=>e.type==='driver_advance').reduce((s,e)=>s+(e.amount_paisa||0),0);}
function jExpensesExclAdvance(jid){return jExpenses(jid).filter(e=>e.type!=='driver_advance').reduce((s,e)=>s+(e.amount_paisa||0),0);}
function jAdvances(jid){return jExpenses(jid).filter(e=>e.type==='driver_advance').slice().sort((a,b)=>a.date<b.date?1:-1);}
function advSourceRaw(a){
  if(a.advance_source==='customer')return 'Customer — '+nm('customers',a.advance_customer_id);
  if(a.advance_source==='payee')return 'Payee — '+(a.advance_payee||'—');
  return 'Company — '+nm('accounts',a.account_id);
}
function advSourceLabel(a){return esc(advSourceRaw(a));}
function payeeOpts(sel){return listOpts('payee',sel);}
function advNewPayee(selId){

      <button type="button" class="btn ghost sm" onclick="advNewPayee('adv_payee')" style="margin-top:6px">+ New payee</button></div>
    <div class="frow"><label class="req">Amount (PKR)</label><input type="number" step="0.01" min="0" id="adv_amount" value="${esc(moneyVal(rec.amount_paisa))}"></div>

  const v=V('adv_source');
  document.getElementById('adv_company_wrap').style.display=v==='company'?'':'none';
  document.getElementById('adv_customer_wrap').style.display=v==='customer'?'':'none';
  document.getElementById('adv_payee_wrap').style.display=v==='payee'?'':'none';
}
function advTripChange(){
  const tid=parseInt(V('adv_trip'),10)||null; if(!tid)return;
  const t=byId('trips',tid), sel=document.getElementById('adv_customer');
  if(t&&sel)sel.value=t.customer_id;
}
function advanceSave(id,jid){
  const amount=P(V('adv_amount'));
  if(amount==null||amount<=0){toast('Amount is required',true);return;}
  const date=V('adv_date'); if(!date){toast('Date is required',true);return;}
  const source=V('adv_source');
  const tripId=parseInt(V('adv_trip'),10)||null;
  const j=byId('journeys',jid);
  const base={journey_id:jid,trip_id:tripId,date:date,type:'driver_advance',amount_paisa:amount,
    notes:V('adv_notes'),advance_source:source,
    account_id:source==='company'?(parseInt(V('adv_account'),10)||null):null,
    advance_customer_id:source==='customer'?(parseInt(V('adv_customer'),10)||null):null,
    advance_payee:source==='payee'?V('adv_payee'):null};
  const rec=id?upd('expenses',id,base):add('expenses',base);
  const carrierId=j?j.carrier_id:null;
  const lines=[{account_code:'1200',subsidiary_type:'carrier',subsidiary_id:carrierId,debit_paisa:amount,credit_paisa:0}];
  if(source==='company')lines.push({account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:rec.account_id,debit_paisa:0,credit_paisa:amount});
  else if(source==='customer')lines.push({account_code:'1100',subsidiary_type:'customer',subsidiary_id:rec.advance_customer_id,debit_paisa:0,credit_paisa:amount});
  else lines.push({account_code:'2900',subsidiary_type:'payee_name',subsidiary_id:null,debit_paisa:0,credit_paisa:amount});
  const entryId=repostEntry(rec.journal_entry_id,'driver_advance','expenses',rec.id,lines,
    'Driver advance — '+advSourceRaw(rec)+(rec.notes?' — '+rec.notes:''));
  upd('expenses',rec.id,{journal_entry_id:entryId});
  toast(id?'Driver advance updated':'Driver advance recorded');
  closeModal();render();
}
function jFuel(jid){return all('fuel').filter(f=>f.journey_id==jid);}
function jOilFilter(jid){return all('vendortx').filter(x=>{const v=byId('vendors',x.vendor_id);return v&&v.category==='oil_filter'&&x.journey_id==jid;});}
function jClearingCharges(jid){return jLoads(jid).reduce((s,t)=>s+(t.agent_id!=null?(t.agent_cost_paisa||0):0),0);}
/* Only settled, company-borne claims are a real cost to us — carrier-borne comes off their
   payable instead, insurance-borne is a receivable pending reimbursement, and client-borne
   costs us nothing (see postClaimEntry). Open/under-review claims aren't final yet either. */
function jClaimsCost(jid){
  const tripIds=new Set(jLoads(jid).map(t=>t.id));
  return all('claims').filter(c=>tripIds.has(c.trip_id)&&c.status==='settled'&&c.cost_bearer==='company')
    .reduce((s,c)=>s+(c.amount_paisa||0),0);
}
/* A fuel transfer settles carrier payables (v4.199) but has nothing to do with pump purchases —
   it still needs to land somewhere in each trip's own Net, though: the receiving trip really did
   use that fuel (a cost, even with no pump receipt behind it), and the giving trip's Diesel/fuel
   line above still carries the FULL pump purchase even though part of it physically left for
   another trip, so it needs the same value back as a credit or its cost is overstated. */
function jFuelTransferReceived(jid){return all('fueltransfers').filter(f=>f.to_journey_id==jid).reduce((s,f)=>s+(f.value_paisa||0),0);}
function jFuelTransferGiven(jid){return all('fueltransfers').filter(f=>f.from_journey_id==jid).reduce((s,f)=>s+(f.value_paisa||0),0);}
/* trip consumables: oil, filters, tyres from warehouse */
function getJourneyConsumables(jid){
  const j=byId('journeys',jid);if(!j)return {oil:0,filters:0,tyres:0};
  return {
    oil:j.consumables_oil_liters||0,
    filters:j.consumables_filters||0,
    tyres:j.consumables_tyres||0,
    oil_cost_paisa:(j.consumables_oil_liters||0)*15000, /* Rs 150/L */
    filters_cost_paisa:(j.consumables_filters||0)*80000, /* Rs 800 each */
    tyres_cost_paisa:(j.consumables_tyres||0)*850000 /* Rs 8,500 each */
  };
}
function getConsumablesTotalCost(jid){
  const c=getJourneyConsumables(jid);
  return c.oil_cost_paisa+c.filters_cost_paisa+c.tyres_cost_paisa;
}
function jCostTotal(jid){
  return jExpensesExclAdvance(jid)
    +jFuel(jid).reduce((s,f)=>s+(f.total_paisa||0),0)
    +jOilFilter(jid).reduce((s,x)=>s+(x.amount_paisa||0),0)
    +jClearingCharges(jid)
    +jFuelTransferReceived(jid)-jFuelTransferGiven(jid)
    +getConsumablesTotalCost(jid);
}
function jAdvanceBalance(jid){const opening=byId('journeys',jid)?.opening_balance_paisa||0;return (opening+jDriverAdvance(jid))-jExpensesExclAdvance(jid);}
function getLastTripForDriver(did){
  if(!did)return null;
  const trips=all('journeys').filter(j=>j.driver_id===did&&j.status==='finished').sort((a,b)=>new Date(b.date)-new Date(a.date));
  return trips.length?trips[0]:null;
}
function getPreviousDriverBalance(did){
  const lastTrip=getLastTripForDriver(did);
  if(!lastTrip)return 0;
  return jAdvanceBalance(lastTrip.id);
}
function getCarrierHiringCost(jid){
  const j=byId('journeys',jid);
  if(!j||!j.carrier_id)return 0;
  const c=byId('carriers',j.carrier_id);
  if(!c||c.ownership!=='hired')return 0;
  if(c.pay_type==='flat_rate'&&c.monthly_paisa)return c.monthly_paisa;
  return 0;
}
function getCarrierAdvances(jid){
  return all('expenses').filter(e=>e.journey_id===jid&&e.type==='carrier_advance'&&e.source==='company');
}
function getCarrierAdvanceTotal(jid){
  return getCarrierAdvances(jid).reduce((s,e)=>s+(e.amount_paisa||0),0);
}
function getCarrierFuelProvided(jid){
  return jFuelTransferGiven(jid);
}
function getCarrierPayable(jid){
  const earning=jEarning(jid);
  const hiringCost=getCarrierHiringCost(jid);
  const advances=getCarrierAdvanceTotal(jid);
  const fuel=getCarrierFuelProvided(jid);
  return earning-hiringCost-advances-fuel;
}
function jEarning(jid){return jLoads(jid).reduce((s,t)=>s+(t.freight_paisa||0),0);}
function jReturnLoadBilty(jid){
  const j=byId('journeys',jid); if(!j)return null;
  return jLoads(jid).find(t=>t.load_from===j.route_to&&t.load_to===j.route_from)||null;
}
function jReturnEarning(jid){const b=jReturnLoadBilty(jid);return b?(b.freight_paisa||0):0;}
function jOutboundEarning(jid){return jEarning(jid)-jReturnEarning(jid);}
function jReturnAuto(jid){return !!jReturnLoadBilty(jid);}
function jReturnEffective(jid){
  const j=byId('journeys',jid); if(!j)return 'none';
  if(j.return_load_manual)return j.return_load_manual;
  const bilty=jReturnLoadBilty(jid);
  if(!bilty)return 'none';
  return payStatusValue(bilty);
}
function returnBadge(jid){
  const j=byId('journeys',jid);
  const v=jReturnEffective(jid);
  const m={none:'b-gray',empty_reposition:'b-amber',to_be_billed:'b-gray',to_pay:'b-red',partial:'b-amber',paid:'b-green'};
  const auto=j&&!j.return_load_manual&&jReturnLoadBilty(jid);
  return `<span class="badge ${m[v]||'b-gray'}">${esc(enumLbl(RETURN_LOAD,v))}${auto?' (auto)':''}</span>`;
}
/* Grouped by month, same collapsible pattern as the Booking Register — an ever-growing flat table
   was the odd one out among the app's list pages, and only got harder to scan trip after trip. */
function pageJourneys(){
  const rows=all('journeys').slice().sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||(a.date<b.date?1:-1));
  /* Row order groups open trips first for usability, but the # should be a stable chronological
     count (oldest trip = 1) that doesn't reshuffle every time a trip's status changes. */
  const byDate=all('journeys').slice().sort((a,b)=>(a.date<b.date?-1:(a.date>b.date?1:a.id-b.id)));
  const tripNum=new Map(byDate.map((j,i)=>[j.id,i+1]));
  const byMonth=new Map();
  rows.forEach(j=>{
    const key=(j.date||'').slice(0,7)||'—';
    if(!byMonth.has(key))byMonth.set(key,[]);
    byMonth.get(key).push(j);
  });
  const groups=Array.from(byMonth.entries()).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!window._jrnyExpanded)window._jrnyExpanded=new Set([today().slice(0,7)]);
  return `<div class="pagehead"><h1>${bi('Create Trips','ٹرپ بنائیں')}</h1><div class="sp"></div>
    <button class="btn" onclick="journeyForm()">${biShort('+ Create Trip','+ نیا ٹرپ')}</button></div>
  <div class="small mut" style="margin-bottom:6px">${rows.length} trip${rows.length===1?'':'s'}</div>
  ${groups.length?groups.map(([gkey,items])=>{
    const expanded=window._jrnyExpanded.has(gkey);
    let html=`<div class="card" style="margin-bottom:10px">
      <div class="rowline" style="cursor:pointer" onclick="journeyGroupToggle('${gkey}')">
        <span><b>${expanded?'▾':'▸'} ${gkey==='—'?'No date':esc(monthLabel(gkey))}</b> <span class="badge b-gray">${items.length} trip${items.length===1?'':'s'}</span></span>
      </div>`;
    if(expanded){
      html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      <div class="tblwrap" style="margin:0"><table><thead><tr><th>#</th><th>Trip no.</th><th>Date</th><th>Carrier / Driver</th>
      <th>Route</th><th>Loads</th>
      <th>Return load</th><th>Status</th><th></th></tr></thead><tbody>
      ${items.map(j=>`<tr>
        <td class="mut">${tripNum.get(j.id)}</td>
        <td><a href="#/journey/${j.id}"><b>${esc(j.trip_no)}</b></a></td>
        <td title="${esc(fmtDate(j.date))}">${esc(fmtDateShort(j.date))}</td>
        <td class="stack2" title="${esc(nm('carriers',j.carrier_id))} — ${esc(nm('drivers',j.driver_id))}"><b>${esc(nm('carriers',j.carrier_id))}</b>${j.carrier_log&&j.carrier_log.length?' <span class="badge b-amber">changed</span>':''}<span class="s2-sub">${esc(nm('drivers',j.driver_id))}</span></td>
        <td class="routecell" title="${esc(journeyRouteText(j))}">${journeyRouteDisplay(j)}</td>
        <td>${jLoads(j.id).length}</td>
        <td>${returnBadge(j.id)}</td>

function jStatusToggle(){

function jSuggestStations(){
  const from=V('j_from'),to=V('j_to');
  if(!from||!to){toast('Pick From and To first',true);return;}
  const suggested=suggestStationsBetween(from,to);
  if(!suggested.length){toast('No known en-route cities between '+from+' and '+to+' — add stops manually',true);return;}
  const sel=document.getElementById('j_stations');
  Array.from(sel.options).forEach(o=>{if(suggested.includes(o.value))o.selected=true;});
  toast(suggested.length+' stop(s) suggested — review and adjust as needed');
}
function nextCarrierTripNo(cid){
  const carrier=byId('carriers',cid);
  const code=(carrier&&carrier.name?carrier.name:'CARRIER').replace(/\s+/g,'');
  /* a running count per carrier, not reset each month — "TLT-970-01", "TLT-970-02", ... — so the
     number stays short and two trips never end up sharing one, no matter how the dates fall. The
     old "TLT-970-2026-06-001" scheme was accurate but wide; the Date column already shows when a
     trip happened, so repeating year/month inside the number itself was redundant. */
  const seq=all('journeys').filter(j=>j.carrier_id===cid).length+1;
  return code+'-'+String(seq).padStart(2,'0');
}
/* Suggested next Chalan number — sequential company-wide (CH-2026-0001), same numbering style as
   bilty/invoice numbers. Only a suggestion: the field stays editable, since some offices keep
   their own pre-printed/numbered chalan pads and need to enter that number instead. */
function nextChalanNo(){
  return 'CH-'+new Date().getFullYear()+'-'+String((db.seq.chalan||0)+1).padStart(4,'0');
}
function filterDriversByCarrier(){
  const carrierId=parseInt(V('j_carrier'),10);
  const driverSelect=document.getElementById('j_driver');
  const currentDriverId=parseInt(V('j_driver'),10);

  if(!carrierId){
    // If no carrier selected, show all drivers
    driverSelect.innerHTML=fkOptions('drivers',currentDriverId);
    return;
  }

  // Get all drivers and filter by carrier
  const filteredDrivers=all('drivers').filter(d=>d.carrier_id===carrierId);

  // Build options HTML
  let html='<option value="">— Select driver —</option>';
  filteredDrivers.forEach(d=>{
    const driverId=d.id;
    const selected=driverId===currentDriverId?'selected':'';
    html+=`<option value="${driverId}" ${selected}>${esc(d.name||'Unnamed Driver')}</option>`;
  });

  // If no drivers found for this carrier, show message
  if(filteredDrivers.length===0){
    html='<option value="" selected>— No drivers assigned to this carrier —</option>';
  }

  driverSelect.innerHTML=html;
}

function journeySave(id){
  if(!can('journeys')){toast('Not permitted',true);return;}
  const date=V('j_date'),cid=parseInt(V('j_carrier'),10)||null,from=V('j_from'),to=V('j_to');
  if(!date||!cid||!from||!to){toast('Date, carrier, from and to are required',true);return;}
  const stations=Array.from(document.getElementById('j_stations').selectedOptions).map(o=>o.value);
  if(!stations.includes(from))stations.unshift(from);
  if(!stations.includes(to))stations.push(to);
  const status=V('j_status')||'open';
  const date_end=status==='finished'?(V('j_date_end')||today()):null;
  const opening_balance_paisa=parseInt(V('j_opening_balance'))||0;
  const obj={date:date,carrier_id:cid,driver_id:parseInt(V('j_driver'),10)||null,
    route_from:from,route_to:to,stations:stations,status:status,notes:V('j_notes'),
    return_load_manual:V('j_return')||null,date_end:date_end,chalan_no:V('j_chalan')||nextChalanNo(),opening_balance_paisa:opening_balance_paisa};
  let j;
  if(id){j=upd('journeys',id,obj);}
  else{
    obj.trip_no=nextCarrierTripNo(cid);
    obj.carrier_log=[];
    db.seq.chalan=(db.seq.chalan||0)+1;
    j=add('journeys',obj);
  }
  toast('Trip saved — '+j.trip_no);goto('#/journey/'+j.id);
}
function journeyDel(id){
  if(!can('journeys')){toast('Not permitted',true);return;}
  const nExp=jExpenses(id).length, nFuel=jFuel(id).length;
  if(nExp||nFuel){
    toast('Cannot delete — this trip has '+nExp+' expense(s) and '+nFuel+' fuel entr'+(nFuel===1?'y':'ies')
      +' logged against it. Reassign or delete those first (Trip Expenses / Diesel & Fuel).',true);
    return;
  }
  if(!confirm('Delete this trip? Its loads (bilties) are kept and become unassigned.'))return;
  jLoads(id).forEach(t=>upd('trips',t.id,{journey_id:null}));
  softDel('journeys',id);toast('Trip deleted');goto('#/journeys');
}

function alFilterRows(){
  const cust=V('al_custfilter'), date=V('al_datefilter');
  document.querySelectorAll('tr[data-cust]').forEach(tr=>{
    const custOk=!cust||tr.getAttribute('data-cust')===cust;
    const dateOk=!date||tr.getAttribute('data-date')===date;
    tr.style.display=(custOk&&dateOk)?'':'none';
  });
}
function alSuggest(tid){
  const box=document.getElementById('al_sg_'+tid); if(!box)return;
  const t=byId('trips',tid); if(!t){box.innerHTML='';return;}
  const from=V('al_f_'+tid), to=V('al_t_'+tid), fr=document.getElementById('al_fr_'+tid);
  if(!from||!to||!t.customer_id){box.innerHTML='';return;}
  const dt=t.date||today();
  const matches=all('agreements').filter(a=>a.status==='active'&&a.customer_id==t.customer_id
    &&(a.route_from||'').toLowerCase()===from.toLowerCase()
    &&(a.route_to||'').toLowerCase()===to.toLowerCase()
    &&a.valid_from<=dt&&a.valid_to>=dt);
  if(!matches.length){box.innerHTML='';return;}
  const tiers=collapseAgreementsByTier(matches);
  if(tiers.length===1){
    const ag=tiers[0];
    box.innerHTML=`<button type="button" class="btn ghost sm" onclick="alUseSuggest(${tid},${ag.rate_paisa})" title="${esc(ag.vehicle_type||'')}">Use ${pkr(ag.rate_paisa)}</button>`;
    if(fr&&fr.value===''){fr.value=moneyVal(ag.rate_paisa);fr.style.borderColor='';alFreightCalc();}
  }else{
    tiers.sort((a,b)=>a.rate_paisa-b.rate_paisa);
    box.innerHTML=`<select style="width:100%;max-width:130px" onchange="if(this.value)alUseSuggest(${tid},this.value)">
      <option value="">Pick tier…</option>
      ${tiers.map(m=>`<option value="${m.rate_paisa}">${esc(m.vehicle_type||pkr(m.rate_paisa))} — ${pkr(m.rate_paisa)}</option>`).join('')}
      </select>`;
  }
}
function alUseSuggest(tid,paisa){
  const fr=document.getElementById('al_fr_'+tid); if(!fr)return;
  fr.value=moneyVal(paisa); fr.style.borderColor='';
  alFreightCalc();
}
function jAddAll(on){document.querySelectorAll('input[name="al_ck"]').forEach(c=>{if(c.closest('tr').style.display!=='none')c.checked=on;});alFreightCalc();}
function alFreightCalc(){
  const el=document.getElementById('al_frtotal'); if(!el)return;
  let sum=0;
  document.querySelectorAll('input[name="al_ck"]:checked').forEach(c=>{
    const v=P(V('al_fr_'+c.value)); if(v!=null)sum+=v;
  });
  el.textContent=pkr(sum);
}
function jAddLoadSave(jid){
  const j=byId('journeys',jid);
  const picked=Array.from(document.querySelectorAll('input[name="al_ck"]:checked')).map(c=>parseInt(c.value,10));
  if(!picked.length){toast('Tick at least one bilty',true);return;}
  for(const tid of picked){
    if(!V('al_f_'+tid)||!V('al_t_'+tid)){toast('Set load and unload stations for every ticked bilty',true);return;}
  }
  const blanks=picked.filter(tid=>V('al_fr_'+tid)==='');
  if(blanks.length&&!confirm(blanks.length+' bilty(s) have no freight set — they will add Rs 0 to this trip\'s Earning. Continue anyway?'))return;
  const after=jLoads(jid).length+picked.length;
  if(after>10&&!confirm('This trip will carry '+after+' loads — more than the usual 10 per carrier. Continue?'))return;
  picked.forEach(tid=>{
    const bt=byId('trips',tid);
    upd('trips',tid,{journey_id:jid,load_from:V('al_f_'+tid),load_to:V('al_t_'+tid),
      freight_paisa:P(V('al_fr_'+tid)),carrier_id:j.carrier_id,driver_id:j.driver_id,
      status:bt.status!=='closed'?'in_transit':bt.status});
  });
  toast(picked.length+' load(s) added to '+j.trip_no+' — status set to In transit');render();
}
function jRemoveLoad(tid,jid){
  if(!confirm('Remove this load from the trip? The bilty itself is kept.'))return;
  const t=byId('trips',tid);
  upd('trips',tid,{journey_id:null,status:t.status==='in_transit'?'booked':t.status});
  toast('Load removed');render();
}

function jChangeCarrierSave(jid){
  const j=byId('journeys',jid);
  const nc=parseInt(V('cc_carrier'),10)||null,reason=V('cc_reason');
  if(!nc||!reason){toast('New carrier and reason are required',true);return;}
  if(nc==j.carrier_id){toast('That is already the current carrier',true);return;}
  const nd=parseInt(V('cc_driver'),10)||null;
  const log=(j.carrier_log||[]).concat([{from:j.carrier_id,to:nc,reason:reason,at:nowISO(),by:cuName()}]);
  upd('journeys',jid,{carrier_id:nc,driver_id:nd||j.driver_id,carrier_log:log});
  jLoads(jid).forEach(t=>{
    if(t.status!=='delivered'&&t.status!=='closed')upd('trips',t.id,{carrier_id:nc,driver_id:nd||t.driver_id});
  });
  toast('Carrier changed and logged');render();
}
function jFinish(jid){
  if(!confirm('Finish this trip? Loads stay linked for records.'))return;
  upd('journeys',jid,{status:'finished',date_end:today()});

  /* Phase 3.1: Auto-deduct consumables from warehouse stock */
  const j=byId('journeys',jid);
  if(j){
    const cons=getJourneyConsumables(jid);
    const karachi_depot=all('stock_locations').find(l=>l.name.includes('Karachi'));
    if(karachi_depot&&(cons.oil>0||cons.filters>0||cons.tyres>0)){
      /* Find stock items */
      const oil_item=all('stock_items').find(i=>i.name.includes('Engine Oil'));
      const filter_item=all('stock_items').find(i=>i.name.includes('Air Filter'));
      const tyre_item=all('stock_items').find(i=>i.name.includes('Tyre'));

      /* Deduct oil */
      if(cons.oil>0&&oil_item){
        add('stock_transactions',{
          stock_item_id:oil_item.id,stock_location_id:karachi_depot.id,type:'consumption',
          quantity:cons.oil,reference:`Trip ${j.trip_no}`,date:today(),
          notes:`Trip ${j.trip_no} finished - oil consumption`,unit_cost_paisa:oil_item.unit_cost_paisa
        });
      }
      /* Deduct filters */
      if(cons.filters>0&&filter_item){
        add('stock_transactions',{
          stock_item_id:filter_item.id,stock_location_id:karachi_depot.id,type:'consumption',
          quantity:cons.filters,reference:`Trip ${j.trip_no}`,date:today(),
          notes:`Trip ${j.trip_no} finished - filter consumption`,unit_cost_paisa:filter_item.unit_cost_paisa
        });
      }
      /* Deduct tyres */
      if(cons.tyres>0&&tyre_item){
        add('stock_transactions',{
          stock_item_id:tyre_item.id,stock_location_id:karachi_depot.id,type:'consumption',
          quantity:cons.tyres,reference:`Trip ${j.trip_no}`,date:today(),
          notes:`Trip ${j.trip_no} finished - tyre consumption`,unit_cost_paisa:tyre_item.unit_cost_paisa
        });
      }
      if(cons.oil>0||cons.filters>0||cons.tyres>0){
        toast(`Consumables deducted from Karachi Depot stock`);
      }
    }
  }

  toast('Trip finished');render();
}

function ckFor(tripId,stage){return all('checklists').find(c=>c.trip_id==tripId&&c.stage===stage);}
function ckSummary(c){
  if(!c)return '<span class="mut small">Not recorded yet</span>';
  const n={present:0,missing:0,damaged:0,unset:0};
  c.items.forEach(it=>n[it.state||'unset']++);
  const flags=c.items.filter(it=>it.state==='missing'||it.state==='damaged');
  return `<span class="badge b-green">${n.present} present</span>
    ${n.missing?`<span class="badge b-red">${n.missing} missing</span>`:''}
    ${n.damaged?`<span class="badge b-amber">${n.damaged} damaged</span>`:''}
    ${n.unset?`<span class="badge b-gray">${n.unset} unchecked</span>`:''}
    ${flags.length?`<div class="small mut" style="margin-top:6px">${flags.map(it=>esc(CK_ITEMS[it.i][0]+(it.note?' — '+it.note:''))).join('; ')}</div>`:''}`;
}

/* checklist editor */
function ckEditor(tripId,stage,ro){
  const t=byId('trips',tripId);
  if(!t||!tripAccessible(t)){toast('Not permitted',true);return;}
  if(!ro&&!(can('checklist')&&state.user.role!=='carrier')){toast('Not permitted',true);return;}
  const ex=ckFor(tripId,stage);
  window._ckItems=CK_ITEMS.map((x,i)=>{
    const old=ex?ex.items.find(it=>it.i===i):null;
    return {i:i,state:old?old.state:null,note:old?old.note:''};
  });
  openModal(`<h2>${stage==='pickup'?'Pickup':'Delivery'} checklist — bilty ${esc(t.bilty_no)}</h2>
  ${ro?'':`<div class="small mut" style="margin-bottom:8px">Tap a state for each item. Tap again to clear.
    <button class="btn ghost sm" onclick="ckAll('present')">All present</button></div>`}
  <div>${window._ckItems.map(it=>`<div class="ckrow">
    <div class="mut small">${it.i+1}</div>
    <div>${esc(CK_ITEMS[it.i][0])}</div>
    <div class="urdu">${esc(CK_ITEMS[it.i][1])}</div>
    <div class="ckstates" id="cks_${it.i}">${CK_STATE.map(s=>
      `<button class="ckb ${it.state===s[0]?'on-'+s[0]:''}" ${ro?'disabled':''} onclick="ckSet(${it.i},'${s[0]}',this)">${s[1]}</button>`).join('')}</div>
    <input id="ckn_${it.i}" value="${esc(it.note)}" placeholder="note" ${ro?'disabled':''}>
  </div>`).join('')}</div>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">${ro?'Close':'Cancel'}</button>
  ${ro?'':`<button class="btn" onclick="ckSave(${tripId},'${stage}')">Save checklist</button>`}</div>`,true);
}
function ckSet(i,st,btn){
  const it=window._ckItems[i];
  it.state=(it.state===st)?null:st;
  const wrap=document.getElementById('cks_'+i);
  Array.from(wrap.children).forEach((b,idx)=>{
    b.className='ckb'+(it.state===CK_STATE[idx][0]?' on-'+it.state:'');
  });
}
function ckAll(st){
  window._ckItems.forEach(it=>{it.state=st;
    const wrap=document.getElementById('cks_'+it.i);
    Array.from(wrap.children).forEach((b,idx)=>{b.className='ckb'+(CK_STATE[idx][0]===st?' on-'+st:'');});
  });
}
function ckSave(tripId,stage){
  const items=window._ckItems.map(it=>({i:it.i,state:it.state,note:V('ckn_'+it.i)}));
  const done=items.every(it=>it.state);
  const ex=ckFor(tripId,stage);
  const patch={trip_id:tripId,stage:stage,items:items,completed_at:done?nowISO():null};
  if(ex)upd('checklists',ex.id,patch);else add('checklists',patch);
  toast((stage==='pickup'?'Pickup':'Delivery')+' checklist saved'+(done?'':' (incomplete)'));
  render();
}

function expenseForm(id,tripId,journeyId){

  const t=rec.trip_id?byId('trips',rec.trip_id):null;
  if(t&&!tripAccessible(t)){toast('Not permitted',true);return;}
  if(tripId&&!id&&!journeyId){
    const tt=byId('trips',tripId);
    if(!tt||!tt.journey_id){toast('Load this bilty onto a Trip first (Create Trips) before adding expenses',true);return;}
    journeyId=tt.journey_id; rec.journey_id=journeyId;
  }
  const lockTrip=!!(tripId&&!id);
  const lockJourney=!!(journeyId&&!id);
  if(!id&&!journeyOptionsForUser(rec.journey_id).length){toast('No trips available — create one on Create Trips first',true);return;}
  const jList=journeyOptionsForUser(rec.journey_id);
  const defaultJid=rec.journey_id||(jList[0]&&jList[0].id)||null;
  const defaultJourney=defaultJid?byId('journeys',defaultJid):null;

    <div class="frow"><label class="req">Trip</label>

      <select id="e_trip" ${lockTrip?'disabled':''}>${expTripOptionsHTML(defaultJid,rec.trip_id)}</select>
      <div class="hint">Optional — attribute this expense to one car's bilty on this trip for cost-plus billing.</div></div>
    <div class="frow"><label class="req">Date</label><input type="date" id="e_date" value="${esc(rec.date||'')}"
      min="${esc((defaultJourney&&defaultJourney.date)||'')}" max="${esc((defaultJourney&&defaultJourney.date_end)||'')}"></div>
    <div class="frow"><label>Paid from account</label><select id="e_account">${accountOpts(rec.account_id||1)}</select></div>
    <div class="frow"><label>Location</label><input id="e_loc" value="${esc(rec.location||'')}"></div>
    <div class="frow full"><label>Notes</label><input id="e_notes" value="${esc(rec.notes||'')}"></div>`;
  if(id){
    openModal(`<h2>Edit Expense — ${esc(enumLbl(EXP_TYPE,rec.type))}</h2>
    <div class="fgrid">${shared}
      <div class="frow"><label class="req">Amount (PKR)</label>
        <input type="number" step="0.01" min="0" id="e_amount" value="${esc(moneyVal(rec.amount_paisa))}"></div>
    </div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="expenseSave(${id},null)">Save</button></div>`);
  }else{
    openModal(`<h2>Add Trip Expenses</h2>
    <div class="fgrid">${shared}</div>
    <div class="hint" style="margin:8px 0">To log a driver advance (from company, customer, or another payee), close this and use the <b>+ Driver Advance</b> button on the trip page instead.</div>
    <div style="margin:14px 0 6px"><b class="small">Expense heads — actual spending, enter amounts where applicable</b></div>
    <div class="fgrid">
      ${EXP_TYPE.filter(x=>x[0]!=='driver_advance').map(x=>`<div class="frow"><label>${esc(x[1])}</label>
        <input type="number" step="0.01" min="0" id="ex_h_${x[0]}" placeholder="0.00" oninput="expTotalCalc()"></div>`).join('')}
    </div>
    <div class="suggest" style="margin-top:12px;font-size:14px">Total Carrier Expense: <b id="ex_total">Rs 0.00</b></div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="expenseSave(null,${lockTrip?(tripId||'null'):'null'})">Save expenses</button></div>`,true);
  }

function expTotalCalc(){
  let s=0;
  EXP_TYPE.forEach(x=>{const v=P(V('ex_h_'+x[0]));if(v!=null)s+=v;});
  const el=document.getElementById('ex_total'); if(el)el.textContent=pkr(s);
}
function expenseSave(id,lockedTrip){
  const tripId=lockedTrip||parseInt(V('e_trip'),10)||null;
  const journeyId=parseInt(V('e_journey'),10)||null;
  if(!journeyId){toast('Select the Trip this expense belongs to',true);return;}
  if(tripId){const t=byId('trips',tripId);if(!t||!tripAccessible(t)){toast('Pick a valid bilty',true);return;}}
  const date=V('e_date');
  if(!date){toast('Date is required',true);return;}
  const accountId=parseInt(V('e_account'),10)||null;
  const base={trip_id:tripId,journey_id:journeyId,date:date,
    account_id:accountId,location:V('e_loc'),notes:V('e_notes')};
  if(id){
    const rec=byId('expenses',id);
    const amount=P(V('e_amount'));
    if(amount==null||amount<=0){toast('Amount is required',true);return;}
    const updated=upd('expenses',id,Object.assign(base,{type:rec.type,amount_paisa:amount}));
    const code=EXP_TYPE_COA[rec.type];
    if(code){
      const entryId=repostEntry(rec.journal_entry_id,'trip_expense','expenses',id,
        [{account_code:code,debit_paisa:amount,credit_paisa:0},
         {account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:accountId,debit_paisa:0,credit_paisa:amount}],
        enumLbl(EXP_TYPE,rec.type)+(base.location?' — '+base.location:''));
      upd('expenses',id,{journal_entry_id:entryId});
    }
    toast('Expense updated');render();return;
  }
  const heads=[];
  EXP_TYPE.forEach(x=>{const v=P(V('ex_h_'+x[0]));if(v!=null&&v>0)heads.push([x[0],v]);});
  if(!heads.length){toast('Enter an amount in at least one expense head',true);return;}
  let tot=0;
  heads.forEach(h=>{
    const rec=add('expenses',Object.assign({},base,{type:h[0],amount_paisa:h[1]}));
    const code=EXP_TYPE_COA[h[0]];
    if(code){
      const entryId=postEntry('trip_expense','expenses',rec.id,
        [{account_code:code,debit_paisa:h[1],credit_paisa:0},
         {account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:accountId,debit_paisa:0,credit_paisa:h[1]}],
        enumLbl(EXP_TYPE,h[0])+(base.location?' — '+base.location:''));
      upd('expenses',rec.id,{journal_entry_id:entryId});
    }
    tot+=h[1];
  });
  toast(heads.length+' expense(s) saved — Total Carrier Expense '+pkr(tot));
  render();
}
/* diesel / fuel — always part of a Trip */
function groupByTrip(rows,amountKey){
  const groups=new Map();
  rows.forEach(r=>{
    const key=r.journey_id||'none';
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(r);
  });
  return Array.from(groups.entries()).map(([jid,list])=>{
    const j=jid!=='none'?byId('journeys',jid):null;
    const total=list.reduce((s,r)=>s+(r[amountKey]||0),0);
    const latestDate=list.reduce((m,r)=>r.date>m?r.date:m,list[0].date);
    return {jid:jid,journey:j,items:list.slice().sort((a,b)=>a.date<b.date?1:-1),total:total,date:latestDate};
  }).sort((a,b)=>a.date<b.date?1:-1);
}

/* Shown on both the Fuel page (litres/trip context) and the Payables page's Carrier tab (where
   the money actually moved) — a fuel transfer settles carrier payables directly through the
   ledger with no row in the "payables" collection, so without this it's invisible on the page
   admins actually check for what's owed to each carrier. */
function fuelTransfersTableHTML(){
  const transfers=all('fueltransfers').slice().sort((a,b)=>a.date<b.date?1:-1);
  const byMonth=new Map();
  transfers.forEach(f=>{
    const key=(f.date||'').slice(0,7)||'—';

    byMonth.get(key).push(f);
  });
  const groups=Array.from(byMonth.entries()).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!window._ftExpanded)window._ftExpanded=new Set([today().slice(0,7)]);
  const row=f=>{

function fuelSave(id){
  const date=V('fu_date'),litres=V('fu_litres')===''?null:parseFloat(V('fu_litres')),total=P(V('fu_total'));
  const journeyId=parseInt(V('fu_journey'),10)||null;
  const vendorId=parseInt(V('fu_vendor'),10)||null;
  if(!journeyId){toast('Select the Trip this fuel belongs to',true);return;}
  if(!vendorId){toast('Select the petrol pump — pumps are registered vendors, billed monthly. Use + New to register one.',true);return;}
  if(!date||litres==null||litres<=0||total==null||total<=0){toast('Date, litres and total price are required',true);return;}
  const odoRaw=V('fu_odo');
  const payMode=V('fu_paymode')||'account';
  /* On the pump's monthly account, no cash moves at the fill-up — the cost builds up as money
     owed to that pump and is settled later against their monthly bill. Only a spot purchase
     (breakdown top-up at whichever pump was nearest) takes cash straight out. */
  const accountId=payMode==='cash'?(parseInt(V('fu_account'),10)||null):null;
  const obj={date:date,journey_id:journeyId,vendor_id:vendorId,pump:nm('vendors',vendorId),litres:litres,
    total_paisa:total,account_id:accountId,pay_mode:payMode,notes:V('fu_notes'),
    odometer_km:odoRaw===''?null:parseFloat(odoRaw)};
  const rec=id?upd('fuel',id,obj):add('fuel',obj);
  const credit=payMode==='cash'
    ?{account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:accountId,debit_paisa:0,credit_paisa:total}
    :{account_code:'2100',subsidiary_type:'vendor',subsidiary_id:vendorId,debit_paisa:0,credit_paisa:total};
  const entryId=repostEntry(rec.journal_entry_id,'fuel','fuel',rec.id,
    [{account_code:'5100',debit_paisa:total,credit_paisa:0},credit],
    'Fuel — '+(rec.pump||'')+(payMode==='cash'?' (paid on the spot)':' (on monthly account)'));
  upd('fuel',rec.id,{journal_entry_id:entryId});
  toast('Fuel entry saved');render();
}

/* Carrier A's truck sometimes hands over diesel from its own tank to Carrier B's truck on the
   road (breakdown, running low) — nothing to do with a pump purchase, no company cash moves.
   This just settles the value between the two carriers: what we owe the receiving carrier goes
   down, what we owe the giving carrier goes up, same as any other carrier payable adjustment. */
/* Both selects used to fall back to journeyOptsHTML(), which has no blank option — so a fresh
   form (nothing preset) silently defaulted BOTH "From" and "To" to the very same trip, and if the
   user only noticed and changed one of the two, the transfer got recorded against whatever trip
   happened to sort first, not the trip they actually meant. Built with an explicit "— Select —"
   placeholder here instead, so an unset side can never masquerade as a real, deliberate choice. */
function ftJourneyOpts(sel){
  const list=journeyOptionsForUser(sel);

    +list.map(j=>`<option value="${j.id}" ${String(sel)===String(j.id)?'selected':''}>${esc(j.trip_no)} — ${journeyRouteDisplay(j)}${j.status==='open'?'':' (finished)'}</option>`).join('');

function fuelTransferSave(id){
  const date=V('ft_date'), litres=V('ft_litres')===''?null:parseFloat(V('ft_litres')), value=P(V('ft_value'));
  const fromJid=parseInt(V('ft_from'),10)||null, toJid=parseInt(V('ft_to'),10)||null;
  if(!date||litres==null||litres<=0){toast('Date and litres are required',true);return;}
  if(!fromJid||!toJid||fromJid===toJid){toast('Pick two different trips',true);return;}
  if(value==null||value<=0){toast('Value is required — what the receiving carrier owes for this fuel',true);return;}
  const fromJ=byId('journeys',fromJid), toJ=byId('journeys',toJid);
  const fromCarrier=fromJ?fromJ.carrier_id:null, toCarrier=toJ?toJ.carrier_id:null;
  if(!fromCarrier||!toCarrier){toast('Both trips need a carrier assigned',true);return;}
  if(fromCarrier===toCarrier){toast('Both trips are on the same carrier — nothing to settle between carriers here',true);return;}
  const obj={date:date,litres:litres,from_journey_id:fromJid,to_journey_id:toJid,value_paisa:value,notes:V('ft_notes')};
  const rec=id?upd('fueltransfers',id,obj):add('fueltransfers',obj);
  const entryId=repostEntry(rec.journal_entry_id,'fuel_transfer','fueltransfers',rec.id,
    [{account_code:'2000',subsidiary_type:'carrier',subsidiary_id:toCarrier,debit_paisa:value,credit_paisa:0},
     {account_code:'2000',subsidiary_type:'carrier',subsidiary_id:fromCarrier,debit_paisa:0,credit_paisa:value}],
    'Fuel transfer — '+litres+' L — '+nm('carriers',fromCarrier)+' ('+fromJ.trip_no+') → '+nm('carriers',toCarrier)+' ('+toJ.trip_no+')'+(obj.notes?' — '+obj.notes:''));

}

/* invoices */
function invTripIds(i){return i.trip_ids||(i.trip_id!=null?[i.trip_id]:[]);}
function invHasTrip(i,tid){return invTripIds(i).includes(tid);}
function invTrips(i){return invTripIds(i).map(tid=>byId('trips',tid)).filter(Boolean);}
function invBiltyLabel(i){
  const trips=invTrips(i);
  if(!trips.length)return '—';
  if(trips.length===1)return trips[0].bilty_no;
  return trips.length+' bilties';
}
function invoiceForTrip(tid){return all('invoices').find(i=>invHasTrip(i,tid));}
function invParts(i){
  const amt=i.amount_paisa||0;
  const srb=i.srb_on?Math.round(amt*(i.srb_rate!=null?i.srb_rate:15)/100):0;
  const gross=amt+srb;
  const wht=i.wht_on?Math.round(gross*(i.wht_rate!=null?i.wht_rate:7)/100):0;
  const srbWh=i.srb_wh_on?Math.round(srb*(i.srb_wh_rate!=null?i.srb_wh_rate:20)/100):0;
  const other=i.tax_paisa||0;
  return {amt:amt,srb:srb,gross:gross,wht:wht,srbWh:srbWh,other:other,total:gross-wht-srbWh+other};
}
function invTotal(i){return invParts(i).total;}
/* Ledger posting deliberately excludes the manual "other/tax_paisa" adjustment — that field already
   does double duty as the customer-advance-deduction mechanism (applyAdvancesToInvoice), which is
   separately posted when the advance is given. Folding it in here too would double-count it. */
function postInvoiceEntry(inv){
  const x=invParts(inv);
  const netAR=x.gross-x.wht-x.srbWh, revenue=x.amt-x.wht, srbPayable=x.srb-x.srbWh;
  const lines=[{account_code:'1100',subsidiary_type:'customer',subsidiary_id:inv.customer_id,debit_paisa:netAR,credit_paisa:0},
    {account_code:'4000',debit_paisa:0,credit_paisa:revenue}];
  if(srbPayable)lines.push({account_code:'2200',debit_paisa:0,credit_paisa:srbPayable});
  const entryId=repostEntry(inv.journal_entry_id,'invoice','invoices',inv.id,lines,'Invoice '+(inv.number||''));
  upd('invoices',inv.id,{journal_entry_id:entryId});
}
function invPaid(i){return all('inpayments').filter(p=>p.invoice_id==i.id).reduce((s,p)=>s+(p.amount_paisa||0),0);}
/* A settled claim is an agreed deduction, so it reduces what the customer still owes on the
   invoice covering that bilty — whoever ends up bearing the cost. Only a client-borne claim
   credits nothing, since the client absorbs their own loss. Open / under-review / rejected
   claims are still disputed and deliberately count for nothing here.
   invOutstanding() is the single definition of "still owed" — use it everywhere rather than
   recomputing invTotal-invPaid, so the figure can never drift between screens. */
function invClaimCredit(i){
  const tids=invTripIds(i);
  return all('claims').filter(c=>c.status==='settled'&&(c.amount_paisa||0)>0
    &&c.cost_bearer!=='client'&&tids.includes(c.trip_id))
    .reduce((s,c)=>s+c.amount_paisa,0);
}
function invOutstanding(i){return invTotal(i)-invPaid(i)-invClaimCredit(i);}
function invStatus(i){const t=invTotal(i);if(t<=0)return 'unpaid';
  const settled=invPaid(i)+invClaimCredit(i);
  return settled>=t?'paid':(settled>0?'partial':'unpaid');}
function invBadge(s){return `<span class="badge ${s==='paid'?'b-green':s==='partial'?'b-amber':'b-red'}">${s}</span>`;}
function srbPayableAmount(i){const x=invParts(i);return x.srb-x.srbWh;}
function srbDueDate(i){
  const d=new Date(invDate(i)+'T00:00:00');
  const due=new Date(d.getFullYear(),d.getMonth()+1,18);
  return due.getFullYear()+'-'+String(due.getMonth()+1).padStart(2,'0')+'-'+String(due.getDate()).padStart(2,'0');
}
function srbPortalReport(){
  const rows=all('invoices').filter(i=>invParts(i).srb>0)
    .map(i=>{const x=invParts(i);return {i:i,x:x,bal:srbPayableAmount(i)-outPaidFor('srb',i.id),due:srbDueDate(i)};})
    .filter(r=>r.bal>0&&r.due<today())
    .sort((a,b)=>a.due<b.due?-1:1);
  if(!rows.length){toast('No overdue SRB payments right now');return;}
  const totG=rows.reduce((s,r)=>s+r.x.gross,0),totH=rows.reduce((s,r)=>s+r.x.srbWh,0),totP=rows.reduce((s,r)=>s+r.bal,0);
  const body=`<div class="hd"><h1>${esc(CO_NAME)}</h1><div class="t">SRB Tax Payable — Outstanding (Overdue)</div></div>
  <div class="hint">Match these figures against the Sindh Revenue Board (SRB) e-portal when filing/paying the 80% SRB payable for each invoice below.</div>
  <table><tr><th>Invoice Number</th><th>Invoice Date</th><th class="r">Gross Amount</th><th class="r">20% SRB Held</th><th class="r">80% SRB Payable Amount</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.i.number)}</td><td>${esc(fmtDate(invDate(r.i)))}</td><td class="r">${pkr(r.x.gross)}</td><td class="r">${pkr(r.x.srbWh)}</td><td class="r">${pkr(r.bal)}</td></tr>`).join('')}
  <tr><td colspan="2"><b>Total</b></td><td class="r"><b>${pkr(totG)}</b></td><td class="r"><b>${pkr(totH)}</b></td><td class="r"><b>${pkr(totP)}</b></td></tr>
  </table>`;
  printOpen('SRB Tax Payable Report',body,true);
}
function srbReminderBadge(dueDateStr,balance){
  if(balance<=0)return '<span class="badge b-green">Paid</span>';
  const now=today();
  if(dueDateStr<now)return '<span class="badge b-red">Overdue</span>';
  const in7=new Date(new Date(now).getTime()+7*86400000).toISOString().slice(0,10);
  if(dueDateStr<=in7)return '<span class="badge b-amber">Due soon</span>';
  return '<span class="badge b-gray">Upcoming</span>';
}

function invoiceForm(id,tripId){

    const t=byId('trips',tripId);

    if(invoiceForTrip(t.id)){toast('Trip already has an invoice',true);return;}
    const priv=!!t.open_market;

function invoiceSave(id,tripId){
  const f=invReadForm();
  if(f.amount_paisa==null||f.amount_paisa<0||V('i_amount')===''){toast('Invoice amount is required',true);return;}
  if(id){
    const rec=byId('invoices',id), edits=rec.edits||[];
    if(rec.amount_paisa!==f.amount_paisa)edits.push({field:'amount',from:rec.amount_paisa,to:f.amount_paisa,by:cuName(),at:nowISO()});
    const oldT=invTotal(rec), newT=invParts(f).total;
    if(oldT!==newT)edits.push({field:'total',from:oldT,to:newT,by:cuName(),at:nowISO()});
    f.edits=edits;
    const updated=upd('invoices',id,f);
    postInvoiceEntry(updated);
  }else{
    const t=byId('trips',tripId);
    f.trip_id=tripId; f.customer_id=t?t.customer_id:null; f.edits=[];
    f.number='INV-'+new Date().getFullYear()+'-'+String((db.seq.invno=(db.seq.invno||0)+1)).padStart(4,'0');
    const inv=add('invoices',f);
    applyAdvancesToInvoice([tripId],inv.id);
    postInvoiceEntry(inv);
  }
  toast('Invoice saved');render();
}
/* Deleting an invoice raised by mistake. Admin only, and blocked while anything depends on it —
   money already received against it, or SRB tax already paid on it — because deleting then would
   leave those payments pointing at nothing. Reverses the accounting entry, frees the bilties to
   be invoiced again, and releases any customer advance that had been applied to it. */
function invoiceDel(id){
  if(!state.user||state.user.role!=='admin'){toast('Only an admin can delete an invoice',true);return;}
  const inv=byId('invoices',id); if(!inv){toast('Not found',true);return;}
  const paid=invPaid(inv);
  if(paid>0){toast('Remove the '+pkr(paid)+' already received against this invoice first (open Payments on it)',true);return;}
  const srbPaid=outPaidFor('srb',inv.id);
  if(srbPaid>0){toast('SRB tax of '+pkr(srbPaid)+' has already been paid against this invoice — reverse that payment first',true);return;}
  const bilties=invTrips(inv).map(t=>t.bilty_no);
  const advances=all('expenses').filter(e=>e.applied_invoice_id===inv.id);
  const advTotal=advances.reduce((s,a)=>s+(a.amount_paisa||0),0);
  if(!confirm('Delete invoice '+inv.number+' ('+pkr(invTotal(inv))+')?\n\n'
    +(bilties.length?'Bilty(s) '+bilties.join(', ')+' become available to invoice again.\n':'')
    +(advTotal?'The '+pkr(advTotal)+' customer advance goes back to being unapplied.\n':'')
    +'\nThe accounting entry is reversed. This is recoverable from a backup.'))return;
  if(inv.journal_entry_id)reverseEntry(inv.journal_entry_id);
  advances.forEach(a=>upd('expenses',a.id,{applied_invoice_id:null}));
  softDel('invoices',id);
  toast('Invoice '+inv.number+' deleted'+(bilties.length?' — '+bilties.length+' bilty(s) can be invoiced again':''));
  render();
}

/* Shared by every "combine several bilties into one invoice" flow (Whole month, Pick & choose) —
   one invoice record, one amount_paisa (the sum), so tax is computed once on the combined total
   rather than per bilty. Returns null if none of the picked trips are still invoiceable. */
function createCombinedInvoice(cid,tripIds){
  const validTrips=tripIds.map(tid=>byId('trips',tid)).filter(t=>t&&!invoiceForTrip(t.id));
  if(!validTrips.length)return null;
  const validIds=validTrips.map(t=>t.id);
  const amount=validTrips.reduce((s,t)=>s+(t.freight_paisa||0),0);
  const advSum=custAdvancesForTrips(validIds).reduce((s,a)=>s+(a.amount_paisa||0),0);
  const inv=add('invoices',{trip_ids:validIds,customer_id:cid,amount_paisa:amount,
    inv_type:'company',srb_on:true,srb_rate:15,wht_on:true,wht_rate:7,srb_wh_on:true,srb_wh_rate:20,
    tax_label:advSum?'Advance collected by driver':'',tax_paisa:advSum?-advSum:0,
    number:'INV-'+new Date().getFullYear()+'-'+String((db.seq.invno=(db.seq.invno||0)+1)).padStart(4,'0'),edits:[]});
  applyAdvancesToInvoice(validIds,inv.id);
  postInvoiceEntry(inv);
  return {inv,validTrips,amount,advSum};
}

function custBulkPayCalc(){
  const el=document.getElementById('cbpSelBox'); if(!el)return;
  const checked=Array.from(document.querySelectorAll('input[name="cbp_ck"]:checked'));
  const selBal=checked.reduce((s,c)=>{const i=byId('invoices',parseInt(c.value,10));return s+(i?invOutstanding(i):0);},0);
  const amt=P(V('cbp_amount'))||0;
  let msg=checked.length+' invoice(s) selected — total balance <b>'+pkr(selBal)+'</b>';
  if(amt>0&&amt<selBal)msg+='. Amount is less than selected balance — invoices will be paid oldest-first; the last covered one ends up partial.';
  if(amt>selBal&&selBal>0)msg+='. Amount exceeds selected balance by '+pkr(amt-selBal)+' — that extra will not be allocated.';
  el.innerHTML=msg;
}
function custBulkPaySave(cid){
  const checked=Array.from(document.querySelectorAll('input[name="cbp_ck"]:checked')).map(c=>parseInt(c.value,10));
  const date=V('cbp_date'), amount=P(V('cbp_amount'));
  if(!checked.length){toast('Tick at least one invoice',true);return;}
  if(!date||amount==null||amount<=0){toast('Date and a positive amount are required',true);return;}
  const method=V('cbp_method'), ref=V('cbp_ref'), account=parseInt(V('cbp_account'),10)||null;
  const invs=checked.map(id=>byId('invoices',id)).filter(Boolean)
    .sort((a,b)=>invDate(a)<invDate(b)?-1:invDate(a)>invDate(b)?1:a.id-b.id);
  let remaining=amount, made=0;
  invs.forEach(i=>{
    if(remaining<=0)return;
    const bal=invOutstanding(i); if(bal<=0)return;
    const pay=Math.min(remaining,bal);
    add('inpayments',{invoice_id:i.id,date:date,amount_paisa:pay,method:method,ref:ref,account_id:account});
    remaining-=pay; made++;
  });
  toast(made+' invoice(s) updated'+(remaining>0?' — '+pkr(remaining)+' left unallocated (exceeds selected invoices\' balance)':''));
  closeModal();render();
}
function invDate(i){
  const dates=invTrips(i).map(t=>t.date).filter(Boolean);
  return dates.length?dates.reduce((m,d)=>d>m?d:m):(i.created_at||'').slice(0,10);
}
function payDate(p){const t=byId('trips',p.trip_id);return t&&t.date?t.date:(p.created_at||'').slice(0,10);}
function agingBuckets(items,dateFn,dueFn){
  const b={d30:0,d60:0,d90:0,d90p:0};
  const now=new Date(today());
  items.forEach(it=>{
    const due=dueFn(it); if(due<=0)return;
    const days=Math.floor((now-new Date(dateFn(it)))/86400000);
    if(days<=30)b.d30+=due; else if(days<=60)b.d60+=due; else if(days<=90)b.d90+=due; else b.d90p+=due;
  });
  return b;
}

/* payables */
function payTotal(p){return (p.base_paisa||0)+(p.pay_type==='cost_plus'?expSum(p.trip_id):0);}
/* A settled claim the carrier agreed to bear comes off what we owe them. */
function payClaimDeduction(p){
  return all('claims').filter(c=>c.status==='settled'&&c.cost_bearer==='carrier'
    &&(c.amount_paisa||0)>0&&c.trip_id===p.trip_id)
    .reduce((s,c)=>s+c.amount_paisa,0);
}
function payOutstanding(p){return payTotal(p)-outPaidFor('payable',p.id)-payClaimDeduction(p);}
function outPaidFor(ttype,tid){return all('outpayments').filter(x=>x.ttype===ttype&&x.tid==tid).reduce((s,x)=>s+(x.amount_paisa||0),0);}

  <div class="rowline"><span class="mut">Balance</span><span><b>${pkr(bal)}</b> ${bal<=0?'<span class="badge b-green">settled</span>':paid>0?'<span class="badge b-amber">partial</span>':'<span class="badge b-red">unpaid</span>'}</span></div>

function targetLabel(ttype,tid){

  if(ttype==='overhead'){const x=byId('overheads',tid);return x?'Overhead — '+enumLbl(OH_CATS.map(c=>[c[0],c[1]]),x.category)+(x.payee?' ('+x.payee+')':''):'—';}
  if(ttype==='srb'){const inv=byId('invoices',tid);return inv?'SRB tax payable — Invoice '+inv.number:'—';}
  const x=byId('agentcharges',tid);return x?'Clearing — '+nm('agents',x.agent_id)+' ('+enumLbl(CHARGE_TYPE,x.charge_type)+')':'—';

function targetTotal(ttype,tid){
  if(ttype==='payable')return payTotal(byId('payables',tid));
  if(ttype==='vendortx')return byId('vendortx',tid).amount_paisa;
  if(ttype==='overhead')return byId('overheads',tid).amount_paisa;
  if(ttype==='srb')return srbPayableAmount(byId('invoices',tid));
  return byId('agentcharges',tid).amount_paisa;
}

/* A payment promised to a vendor that's conditional on money still owed to us — "I'll pay once
   customer X pays me" — logged so it's tracked and reminded on, independent of whether the
   underlying receivable has actually come in by the promised date. */

  <div class="small mut" style="margin-bottom:10px">A payment you've promised a vendor — "I'll pay once customer X pays me" — logged so it doesn't get forgotten. You'll get a reminder as the promised date approaches, whether or not the receivable has come in yet.</div>

function salaryDeductionRecalc(){
  const chks=document.querySelectorAll('.adv_chk:checked');
  let totalDeduct=0;
  chks.forEach(c=>{totalDeduct+=parseInt(c.dataset.advAmt||0);});
  const totalElem=document.getElementById('total_deduct');
  const netElem=document.getElementById('net_pay');
  if(totalElem)totalElem.textContent=pkr(totalDeduct);
  if(netElem){
    const grossAmount=P(V('po_amount'));
    const netAmount=Math.max(0,grossAmount-totalDeduct);
    netElem.textContent=pkr(netAmount);
    document.getElementById('po_amount').value=moneyVal(netAmount);
  }
}
function payOutSave(ttype,tid,driverId){
  const amount=P(V('po_amount')),date=V('po_date');
  if(!date||amount==null||amount<=0){toast('Date and a positive amount are required',true);return;}
  const accountId=parseInt(V('po_account'),10)||null;
  const method=V('po_method');

  // Collect selected advance deductions if this is a salary payment
  let advanceIds=[], advanceTotal=0;
  if(driverId&&ttype==='overhead'){
    const chks=document.querySelectorAll('.adv_chk:checked');
    chks.forEach(c=>{
      const advId=parseInt(c.dataset.advId);
      const advAmt=parseInt(c.dataset.advAmt);
      advanceIds.push(advId);
      advanceTotal+=advAmt;
    });
  }

  const rec=add('outpayments',{ttype:ttype,tid:tid,date:date,amount_paisa:amount,method:method,ref:V('po_ref'),
    account_id:accountId,cheque_date:method==='cheque'?(V('po_cheque_date')||null):null,advance_ids_json:advanceIds.length?JSON.stringify(advanceIds):null});
  postOutPaymentEntry(rec,driverId);

  // Mark advances as recovered
  advanceIds.forEach(advId=>{
    const adv=byId('employee_advances',advId);
    if(adv){
      const remaining=driverOutstandingAdvances(driverId).reduce((s,a)=>s+(a.id===advId?0:(a.amount_paisa||0)),0);
      upd('employee_advances',advId,{status:remaining>0?'partial_recovered':'settled'});
    }
  });

  toast(advanceTotal>0?`Payment recorded (${pkr(advanceTotal)} from advances, ${pkr(amount)} in cash)`:'Payment recorded');
  render();
}
/* Paying anyone clears what we owe them and reduces cash — the only thing that varies
   is which payable account gets cleared. For salary with advance deductions, also post
   the advance recovery against Employee Receivable. */
function postOutPaymentEntry(rec,driverId){
  const amount=rec.amount_paisa||0, accountId=rec.account_id||null;
  if(!amount)return;
  let debits=[],memo='';

  // Check if advances were deducted from this payment
  let advanceTotal=0;
  if(driverId&&rec.ttype==='overhead'&&rec.advance_ids_json){
    try{
      const advIds=JSON.parse(rec.advance_ids_json);
      advanceTotal=all('employee_advances').filter(a=>advIds.includes(a.id)).reduce((s,a)=>s+(a.amount_paisa||0),0);
    }catch(e){}
  }

  if(rec.ttype==='payable'){
    const p=byId('payables',rec.tid);
    debits.push({account_code:'2000',subsidiary_type:'carrier',subsidiary_id:p?p.carrier_id:null,debit_paisa:amount,credit_paisa:0});
    memo='Payment to '+(p?nm('carriers',p.carrier_id):'carrier');
  }else if(rec.ttype==='vendortx'){
    const x=byId('vendortx',rec.tid);
    debits.push({account_code:'2100',subsidiary_type:'vendor',subsidiary_id:x?x.vendor_id:null,debit_paisa:amount,credit_paisa:0});
    memo='Payment to '+(x?nm('vendors',x.vendor_id):'vendor');
  }else if(rec.ttype==='agentcharge'){
    const x=byId('agentcharges',rec.tid);
    debits.push({account_code:'2150',subsidiary_type:'agent',subsidiary_id:x?x.agent_id:null,debit_paisa:amount,credit_paisa:0});
    memo='Payment to '+(x?nm('agents',x.agent_id):'clearing agent');
  }else if(rec.ttype==='overhead'){
    const oh=byId('overheads',rec.tid);
    const grossAmount=amount+advanceTotal;
    debits.push({account_code:'2400',debit_paisa:grossAmount,credit_paisa:0});
    memo='Overhead payment — '+targetLabel('overhead',rec.tid);
    if(advanceTotal>0 && oh && oh.driver_id){
      debits.push({account_code:'1500',subsidiary_type:'driver',subsidiary_id:oh.driver_id,debit_paisa:0,credit_paisa:advanceTotal});
    }
  }else if(rec.ttype==='srb'){
    const inv=byId('invoices',rec.tid);
    debits.push({account_code:'2200',debit_paisa:amount,credit_paisa:0});
    memo='SRB tax paid — '+(inv?inv.number:'invoice');
  }else return;

  debits.push({account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:accountId,debit_paisa:0,credit_paisa:amount});
  const entryId=repostEntry(rec.journal_entry_id,rec.ttype+'_payment','outpayments',rec.id,debits,memo);
  upd('outpayments',rec.id,{journal_entry_id:entryId});
}
function payOutDel(pid,ttype,tid){
  if(!confirm('Remove this payment entry?'))return;
  const rec=byId('outpayments',pid);
  if(rec&&rec.journal_entry_id)reverseEntry(rec.journal_entry_id);
  softDel('outpayments',pid);render();payOutForm(ttype,tid);
}

function agentChargeForTrip(tid){return all('agentcharges').find(x=>x.trip_id==tid);}
/* Entering a clearing agent and cost on a booking used to store them on the bilty as reference
   only — nothing reached Payables or the books. Saving a bilty now keeps a matching charge in
   step with it. A charge someone entered or edited by hand is left alone, and one that's been
   part-paid is never rewritten. */
function syncAgentChargeForTrip(trip){
  if(!trip)return;
  const existing=all('agentcharges').find(x=>x.trip_id===trip.id);
  if(existing&&!existing.auto_from_bilty)return;
  if(existing&&outPaidFor('agentcharge',existing.id)>0)return;
  const agentId=trip.agent_id, cost=trip.agent_cost_paisa;
  if(agentId==null||cost==null||cost<=0){
    if(existing){
      if(existing.journal_entry_id)reverseEntry(existing.journal_entry_id);
      softDel('agentcharges',existing.id);
    }
    return;
  }
  const vals={agent_id:agentId,trip_id:trip.id,charge_type:'misc',direction:'payable',
    amount_paisa:cost,date:trip.date,auto_from_bilty:true};
  const rec=existing?upd('agentcharges',existing.id,vals):add('agentcharges',vals);
  postSubEntry('agentcharges',rec);
}
function agentChargeQuickCreate(tid){
  const t=byId('trips',tid); if(!t)return;
  const b=t.booking_id?byId('bookings',t.booking_id):null;
  const agentId=t.agent_id!=null?t.agent_id:(b?b.agent_id:null);
  const agentCost=t.agent_id!=null?t.agent_cost_paisa:(b?b.agent_cost_paisa:null);
  if(agentId==null){toast('No clearing agent on file for this bilty',true);return;}
  subForm('agentcharges',null,'Clearing Agent Charge',null,

}

function subForm(coll,fields,title,id,pre){
  if(!can('payables')){toast('Not permitted',true);return;}
  const flds=coll==='vendortx'?VTX_FIELDS:(coll==='overheads'?OH_FIELDS:ACH_FIELDS);
  const rec=id?byId(coll,id):Object.assign({date:today(),direction:'payable'},pre||{});
  openModal(`<h2>${id?'Edit':'New'} ${esc(title)}</h2>
  <div class="fgrid">${flds.map(f=>fieldInput(f,rec[f.k])).join('')}</div>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn" onclick="subSave('${coll}',${id||'null'})">Save</button></div>`);
}
function subSave(coll,id){
  const fields=coll==='vendortx'?VTX_FIELDS:(coll==='overheads'?OH_FIELDS:ACH_FIELDS);
  const vals=readFields(fields); if(!vals)return;
  /* editing a charge by hand takes it out of the bilty's automatic control, so a later bilty
     save can't quietly undo what was just typed here */
  if(coll==='agentcharges'&&id)vals.auto_from_bilty=false;
  const rec=id?upd(coll,id,vals):add(coll,vals);
  postSubEntry(coll,rec);
  toast('Saved');render();
}
/* a vendor bill, clearing-agent charge or overhead is a cost incurred now and paid later —
   expense on one side, a payable to that party on the other. */
function postSubEntry(coll,rec){
  const amt=rec.amount_paisa||0;
  if(rec.skip_ledger)return;
  if(!amt){if(rec.journal_entry_id){reverseEntry(rec.journal_entry_id);upd(coll,rec.id,{journal_entry_id:null});}return;}
  let lines=[],memo='';
  if(coll==='vendortx'){
    const v=byId('vendors',rec.vendor_id);
    const code=VENDOR_CAT_COA[v?v.category:'other']||'5900';
    lines=[{account_code:code,debit_paisa:amt,credit_paisa:0},
      {account_code:'2100',subsidiary_type:'vendor',subsidiary_id:rec.vendor_id,debit_paisa:0,credit_paisa:amt}];
    memo='Vendor bill — '+nm('vendors',rec.vendor_id)+(rec.description?' — '+rec.description:'');
  }else if(coll==='agentcharges'){
    const receivable=(rec.direction||'payable')==='receivable';
    lines=receivable
      ?[{account_code:'2150',subsidiary_type:'agent',subsidiary_id:rec.agent_id,debit_paisa:amt,credit_paisa:0},
        {account_code:'5500',debit_paisa:0,credit_paisa:amt}]
      :[{account_code:'5500',debit_paisa:amt,credit_paisa:0},
        {account_code:'2150',subsidiary_type:'agent',subsidiary_id:rec.agent_id,debit_paisa:0,credit_paisa:amt}];
    memo='Clearing agent '+(receivable?'recovery':'charge')+' — '+nm('agents',rec.agent_id);
  }else{
    const code=OH_CAT_COA[rec.category]||'5950';
    lines=[{account_code:code,debit_paisa:amt,credit_paisa:0},
      {account_code:'2400',debit_paisa:0,credit_paisa:amt}];
    memo='Overhead — '+enumLbl(OH_CATS.map(c=>[c[0],c[1]]),rec.category)+(rec.payee?' ('+rec.payee+')':'');
  }
  const entryId=repostEntry(rec.journal_entry_id,coll==='vendortx'?'vendor_bill':(coll==='agentcharges'?'agent_charge':'overhead'),coll,rec.id,lines,memo);
  upd(coll,rec.id,{journal_entry_id:entryId});
}
function subDel(coll,id){
  if(!confirm('Delete this record?'))return;
  const rec=byId(coll,id);
  if(rec&&rec.journal_entry_id)reverseEntry(rec.journal_entry_id);
  softDel(coll,id);toast('Deleted');render();
}

  if(!can('payables')){toast('Not permitted',true);return;}

function fuelReconcileCalc(){
  const el=document.getElementById('rc_summary'); if(!el)return;
  const vid=parseInt(V('rc_vendor'),10),mon=V('rc_month');
  const fills=fuelReconcileFills(vid,mon);
  const litres=fills.reduce((s,f)=>s+(f.litres||0),0), amount=fills.reduce((s,f)=>s+(f.total_paisa||0),0);
  const already=all('vendortx').find(x=>x.vendor_id==vid&&x.period===mon);
  el.innerHTML=`${fills.length} fill-up(s) recorded for ${esc(mon)} — ${litres} L, app total <b>${pkr(amount)}</b>.`
    +(already?`<div class="warnbox" style="margin-top:6px">Already reconciled for this pump/month (${pkr(already.amount_paisa)}). Creating another will add a duplicate.</div>`:'');
  const amtEl=document.getElementById('rc_amount'); if(amtEl)amtEl.value=moneyVal(amount);
}
function fuelReconcileSave(){
  const vid=parseInt(V('rc_vendor'),10),mon=V('rc_month'),amount=P(V('rc_amount')),date=V('rc_date');
  if(!vid||!mon){toast('Pump and month are required',true);return;}
  if(amount==null||amount<=0){toast('Enter the actual invoice amount',true);return;}
  const already=all('vendortx').find(x=>x.vendor_id==vid&&x.period===mon);
  if(already&&!confirm('This pump already has a reconciled invoice for '+mon+' ('+pkr(already.amount_paisa)+'). Create another anyway?'))return;
  const fills=fuelReconcileFills(vid,mon);
  const litres=fills.reduce((s,f)=>s+(f.litres||0),0);
  /* Each on-account fill-up already built up what we owe this pump, so this bill must NOT be
     posted again in full — that would count the same diesel twice. Only the gap between the
     pump's actual bill and what the fill-ups added up to gets posted here. Spot-paid fills
     are excluded: they were settled at the pump and never appear on the monthly bill. */
  const accrued=fills.filter(f=>!fuelIsCash(f)).reduce((s,f)=>s+(f.total_paisa||0),0);
  const variance=amount-accrued;
  const rec=add('vendortx',{vendor_id:vid,trip_id:null,
    description:'Diesel — '+mon+' ('+fills.length+' fill-up(s), '+litres+' L)',
    amount_paisa:amount,date:date||today(),period:mon,skip_ledger:true,accrued_paisa:accrued});
  if(variance!==0){
    const entryId=postEntry('fuel_bill_variance','vendortx',rec.id,
      variance>0
        ?[{account_code:'5100',debit_paisa:variance,credit_paisa:0},
          {account_code:'2100',subsidiary_type:'vendor',subsidiary_id:vid,debit_paisa:0,credit_paisa:variance}]
        :[{account_code:'2100',subsidiary_type:'vendor',subsidiary_id:vid,debit_paisa:-variance,credit_paisa:0},
          {account_code:'5100',debit_paisa:0,credit_paisa:-variance}],
      'Pump bill vs recorded fill-ups — '+nm('vendors',vid)+' '+mon);
    upd('vendortx',rec.id,{journal_entry_id:entryId});
  }
  toast('Monthly pump invoice created'+(variance!==0?' — '+pkr(Math.abs(variance))+(variance>0?' more':' less')+' than the recorded fill-ups':' — matches the recorded fill-ups exactly')
    +'. Pay it under Payables → Fuel (Petrol Pumps).');
  render();
}
function balBadge(total,paid){
  const bal=total-paid;
  return bal<=0?'<span class="badge b-green">settled</span>':paid>0?'<span class="badge b-amber">partial</span>':'<span class="badge b-red">unpaid</span>';
}
/* Shared month-grouping for every Payables tab — collapsible cards, current month expanded,
   matching the same pattern already used for Create Trips / My Payments / Fuel Transfers. Each
   tab keeps its own independent expand-state (keyed by stateKey) so switching tabs doesn't reset
   what you had open. */
/* Generic version: caller supplies innerFn(monthItems)->html, so a month card can wrap anything —
   a flat table (see monthGroupedTable below) or, for Trip Expenses/Diesel & Fuel, a nested table
   of trip-groups (each itself expandable to line items) built via the existing groupByTrip(). */
function monthCardsWrap(items,dateFn,stateKey,innerFn,emptyMsg){
  window._monthGroupExpanded=window._monthGroupExpanded||{};
  if(!window._monthGroupExpanded[stateKey])window._monthGroupExpanded[stateKey]=new Set([today().slice(0,7)]);
  const expandedSet=window._monthGroupExpanded[stateKey];
  if(!items.length)return `<div class="card"><div class="empty">${emptyMsg}</div></div>`;
  const byMonth=new Map();
  items.forEach(it=>{
    const key=(dateFn(it)||'').slice(0,7)||'—';
    if(!byMonth.has(key))byMonth.set(key,[]);
    byMonth.get(key).push(it);
  });
  const groups=Array.from(byMonth.entries()).sort((a,b)=>b[0].localeCompare(a[0]));
  return groups.map(([gkey,list])=>{
    const expanded=expandedSet.has(gkey);
    let html=`<div class="card" style="margin-bottom:10px">
      <div class="rowline" style="cursor:pointer" onclick="monthGroupToggle('${stateKey}','${gkey}')">
        <span><b>${expanded?'▾':'▸'} ${gkey==='—'?'No date':esc(monthLabel(gkey))}</b> <span class="badge b-gray">${list.length}</span></span>
      </div>`;
    if(expanded)html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">${innerFn(list)}</div>`;
    html+='</div>';
    return html;
  }).join('');
}
function monthGroupedTable(items,dateFn,theadHtml,rowFn,emptyMsg,stateKey){
  window._monthGroupExpanded=window._monthGroupExpanded||{};
  if(!window._monthGroupExpanded[stateKey])window._monthGroupExpanded[stateKey]=new Set([today().slice(0,7)]);
  const expandedSet=window._monthGroupExpanded[stateKey];
  if(!items.length)return `<div class="card"><div class="empty">${emptyMsg}</div></div>`;
  const byMonth=new Map();
  items.forEach(it=>{
    const key=(dateFn(it)||'').slice(0,7)||'—';
    if(!byMonth.has(key))byMonth.set(key,[]);
    byMonth.get(key).push(it);
  });
  const groups=Array.from(byMonth.entries()).sort((a,b)=>b[0].localeCompare(a[0]));
  return groups.map(([gkey,list])=>{
    const expanded=expandedSet.has(gkey);
    let html=`<div class="card" style="margin-bottom:10px">
      <div class="rowline" style="cursor:pointer" onclick="monthGroupToggle('${stateKey}','${gkey}')">
        <span><b>${expanded?'▾':'▸'} ${gkey==='—'?'No date':esc(monthLabel(gkey))}</b> <span class="badge b-gray">${list.length}</span></span>
      </div>`;
    if(expanded){
      html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      <div class="tblwrap" style="margin:0"><table><thead><tr>${theadHtml}</tr></thead><tbody>
      ${list.map(rowFn).join('')}
      </tbody></table></div></div>`;
    }
    html+='</div>';
    return html;
  }).join('');
}
function monthGroupToggle(stateKey,gkey){
  window._monthGroupExpanded=window._monthGroupExpanded||{};

/* A settled claim reduces what the customer owes us. Who absorbs that cost depends on the
   cost bearer: the company (an expense), the carrier (deducted from what we owe them), or an
   insurer (a receivable). A client-borne claim costs us nothing, so it posts nothing.
   Open / under-review claims are still disputed — they deliberately post nothing until
   settled, so the books never show a reduction that hasn't actually been agreed. */
function postClaimEntry(rec){
  const amt=rec.amount_paisa||0;
  const t=byId('trips',rec.trip_id);
  const j=t&&t.journey_id?byId('journeys',t.journey_id):null;
  const bearer=rec.cost_bearer;
  if(!amt||bearer==='client'||rec.status!=='settled'){
    if(rec.journal_entry_id){reverseEntry(rec.journal_entry_id);upd('claims',rec.id,{journal_entry_id:null});}
    return;
  }
  const credit={account_code:'1100',subsidiary_type:'customer',subsidiary_id:t?t.customer_id:null,debit_paisa:0,credit_paisa:amt};
  const debit=bearer==='carrier'
    ?{account_code:'2000',subsidiary_type:'carrier',subsidiary_id:j?j.carrier_id:(t?t.carrier_id:null),debit_paisa:amt,credit_paisa:0}
    :bearer==='insurance'
    ?{account_code:'1160',debit_paisa:amt,credit_paisa:0}
    :{account_code:'5600',debit_paisa:amt,credit_paisa:0};
  const entryId=repostEntry(rec.journal_entry_id,'claim','claims',rec.id,[debit,credit],
    'Claim #'+rec.id+' — '+enumLbl(CLAIM_TYPE,rec.type)+' — borne by '+enumLbl(COST_BEARER,bearer));
  upd('claims',rec.id,{journal_entry_id:entryId});
}

function dashRange(period){
  const t=today();
  const tDate=new Date(t);
  if(period==='today')return {from:t,to:t,label:'Today'};
  if(period==='yesterday'){const yDate=new Date(tDate.getTime()-86400000);const y=dateToString(yDate);return {from:y,to:y,label:'Yesterday'};}
  if(period==='thisweek'){const weekStart=new Date(tDate);weekStart.setDate(tDate.getDate()-tDate.getDay()+(tDate.getDay()===0?-6:1));return {from:dateToString(weekStart),to:t,label:'This week'};}
  if(period==='week')return {from:dateToString(new Date(new Date(t).getTime()-6*86400000)),to:t,label:'Last 7 days'};
  if(period==='month')return {from:t.slice(0,7)+'-01',to:t,label:'This month'};
  if(period==='lastmonth'){const lmDate=new Date(tDate);lmDate.setMonth(tDate.getMonth()-1);const lmStart=lmDate.getFullYear()+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';const lmEnd=dateToString(new Date(lmDate.getFullYear(),lmDate.getMonth()+1,0));return {from:lmStart,to:lmEnd,label:'Last month'};}
  if(period==='3months'){const m3Date=new Date(tDate);m3Date.setMonth(tDate.getMonth()-3);return {from:dateToString(m3Date),to:t,label:'Last 3 months'};}
  if(period==='6months'){const m6Date=new Date(tDate);m6Date.setMonth(tDate.getMonth()-6);return {from:dateToString(m6Date),to:t,label:'Last 6 months'};}
  if(period==='annual')return {from:t.slice(0,4)+'-01-01',to:t,label:'Annual'};
  return {from:t.slice(0,7)+'-01',to:t,label:'This month'};
}

  );

  const months=[];const d=new Date();

  const attention=[];

  return `${welcomeBanner()}<div class="pagehead"><h1>Dashboard</h1><div class="sp"></div>

  <div class="cards dash-kpis">
    ${kpis.map((k,i)=>{const handlers=['showRecvPopup()','showPayPopup()','','',''];return `<div onclick="${handlers[i]}" style="text-decoration:none;color:inherit;cursor:pointer"><div class="stat" style="cursor:pointer;transition:all 0.2s"><div class="l">${k[1]}</div><div class="v">${k[0]}</div>${k[2]||''}<div style="font-size:12px;color:#0176D3;font-weight:600;margin-top:6px">${k[4]||''}</div></div></div>`}).join('')}
  </div>
  ${attention.length?`<div class="card" style="border-left:4px solid var(--danger);margin-bottom:16px">
    <h2>Needs attention</h2>
    ${attention.map(a=>a.action?
      `<a href="javascript:void(0)" onclick="${a.action}" class="rowline" style="text-decoration:none;color:inherit">
      <span><span class="agedot" style="background:${a.color}"></span>${esc(a.label)}</span><span class="mut small">Open →</span></a>`
      :`<a href="${a.href}" class="rowline" style="text-decoration:none;color:inherit">
      <span><span class="agedot" style="background:${a.color}"></span>${esc(a.label)}</span><span class="mut small">View →</span></a>`
    ).join('')}
  </div>`:`<div class="card" style="border-left:4px solid var(--ok);margin-bottom:16px">
    <div class="rowline" style="border:0"><span>✓ All clear — nothing needs attention right now.</span></div>
  </div>`}
  <div class="grid2">

      <div class="bars">${months.map(m=>`<div class="bar"><div class="bval">${m.n||''}</div>
        <div class="bfill" style="height:${Math.round(m.n/maxN*88)+2}px"></div><div class="blbl">${m.lbl}</div></div>`).join('')}</div></div>

function accFlows(accId){
  const inn=all('inpayments').filter(p=>(p.account_id||null)==accId).reduce((s,p)=>s+(p.amount_paisa||0),0)
    +all('contras').filter(c=>(c.to_account_id||null)==accId).reduce((s,c)=>s+(c.amount_paisa||0),0);
  const out=all('outpayments').filter(p=>(p.account_id||null)==accId).reduce((s,p)=>s+(p.amount_paisa||0),0)
    +all('expenses').filter(e=>(e.account_id||null)==accId).reduce((s,e)=>s+(e.amount_paisa||0),0)
    +all('fuel').filter(f=>(f.account_id||null)==accId).reduce((s,f)=>s+(f.total_paisa||0),0)
    +all('contras').filter(c=>(c.from_account_id||null)==accId).reduce((s,c)=>s+(c.amount_paisa||0),0);
  return {inn:inn,out:out};
}
