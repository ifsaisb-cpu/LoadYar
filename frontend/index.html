function contraSave(id){
  const date=V('cx_date'), amount=P(V('cx_amount'));
  const fromId=parseInt(V('cx_from'),10)||null, toId=parseInt(V('cx_to'),10)||null;
  if(!date||amount==null||amount<=0){toast('Date and a positive amount are required',true);return;}
  if(!fromId||!toId||fromId===toId){toast('Pick two different accounts',true);return;}
  const obj={date:date,from_account_id:fromId,to_account_id:toId,amount_paisa:amount,notes:V('cx_notes')};
  const rec=id?upd('contras',id,obj):add('contras',obj);
  const entryId=repostEntry(rec.journal_entry_id,'contra','contras',rec.id,
    [{account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:toId,debit_paisa:amount,credit_paisa:0},
     {account_code:'1000',subsidiary_type:'cash_account',subsidiary_id:fromId,debit_paisa:0,credit_paisa:amount}],
    'Transfer '+nm('accounts',fromId)+' → '+nm('accounts',toId)+(obj.notes?' — '+obj.notes:''));
  upd('contras',rec.id,{journal_entry_id:entryId});
  toast('Transfer recorded');closeModal();render();
}
function contraDel(id){
  if(!confirm('Delete this transfer?'))return;
  const rec=byId('contras',id);
  if(rec&&rec.journal_entry_id)reverseEntry(rec.journal_entry_id);
  softDel('contras',id);toast('Deleted');render();
}
function isCompanyCashExpense(e){return e.type!=='driver_advance'||(e.advance_source||'company')==='company';}
function finTotals(from,to){
  const inRange=(d)=>d>=from&&d<=to;
  const income=all('inpayments').filter(p=>inRange(p.date)).reduce((s,p)=>s+(p.amount_paisa||0),0);
  const ohFixed=OH_CATS.filter(c=>c[2]==='fixed').map(c=>c[0]);
  let fixedSpend=0,runningSpend=0;
  all('outpayments').filter(p=>inRange(p.date)).forEach(p=>{
    const oh=p.ttype==='overhead'?byId('overheads',p.tid):null;
    if(oh&&ohFixed.includes(oh.category))fixedSpend+=p.amount_paisa||0; else runningSpend+=p.amount_paisa||0;
  });
  all('expenses').filter(e=>inRange(e.date)&&isCompanyCashExpense(e)).forEach(e=>runningSpend+=e.amount_paisa||0);
  all('fuel').filter(f=>inRange(f.date)).forEach(f=>runningSpend+=f.total_paisa||0);
  return {income:income,fixedSpend:fixedSpend,runningSpend:runningSpend,spend:fixedSpend+runningSpend};
}
function finPrevPeriod(from,to){
  const days=Math.round((new Date(to)-new Date(from))/86400000)+1;
  const prevTo=dateToString(new Date(new Date(from).getTime()-86400000));
  const prevFrom=dateToString(new Date(new Date(prevTo).getTime()-(days-1)*86400000));
  return {from:prevFrom,to:prevTo};
}
function finTrend(curr,prev,goodIsUp){
  const diff=curr-prev;
  if(diff===0)return '<div class="small mut" style="margin-top:2px">No change vs previous period</div>';
  const up=diff>0, good=up===goodIsUp;
  return `<div class="small" style="margin-top:2px;color:${good?'var(--ok)':'var(--danger)'}">${up?'▲':'▼'} ${pkr0(Math.abs(diff))} vs previous period</div>`;
}
function pkrCompact(p){
  const v=Math.round(Math.abs(p)/100);
  const s=v>=100000?(v/100000).toFixed(1)+'L':v>=1000?Math.round(v/1000)+'k':String(v);
  return (p<0?'-':'')+s;
}
function finCategoryBreakdown(from,to){
  const inRange=(d)=>d>=from&&d<=to;
  const byCat=new Map();
  const addCat=(label,amt)=>{if(!amt)return;byCat.set(label,(byCat.get(label)||0)+amt);};
  all('outpayments').filter(p=>inRange(p.date)&&p.ttype==='overhead').forEach(p=>{
    const oh=byId('overheads',p.tid);
    const cat=oh?OH_CATS.find(c=>c[0]===oh.category):null;
    addCat(cat?cat[1]:'Other overhead',p.amount_paisa||0);
  });
  EXP_TYPE.forEach(c=>addCat(c[1],all('expenses').filter(e=>inRange(e.date)&&e.type===c[0]&&isCompanyCashExpense(e)).reduce((s,e)=>s+(e.amount_paisa||0),0)));
  addCat('Diesel / Fuel',all('fuel').filter(f=>inRange(f.date)).reduce((s,f)=>s+(f.total_paisa||0),0));
  return Array.from(byCat.entries()).map(([label,amt])=>({label:label,amt:amt})).sort((a,b)=>b.amt-a.amt);
}
function accHistoryRows(accId){
  const acc=byId('accounts',accId); if(!acc)return null;
  const rows=[];
  all('inpayments').filter(p=>(p.account_id||null)===accId).forEach(p=>{
    const inv=byId('invoices',p.invoice_id);
    rows.push({date:p.date,desc:'Received — '+(inv?inv.number:'invoice'),amount:p.amount_paisa,inn:true});
  });
  all('outpayments').filter(p=>(p.account_id||null)===accId).forEach(p=>{
    rows.push({date:p.date,desc:'Paid — '+targetLabel(p.ttype,p.tid),amount:p.amount_paisa,inn:false});
  });
  all('expenses').filter(e=>(e.account_id||null)===accId).forEach(e=>{
    rows.push({date:e.date,desc:'Trip expense — '+enumLbl(EXP_TYPE,e.type),amount:e.amount_paisa,inn:false});
  });
  all('fuel').filter(f=>(f.account_id||null)===accId).forEach(f=>{
    rows.push({date:f.date,desc:'Fuel — '+(f.pump||'—'),amount:f.total_paisa,inn:false});
  });
  rows.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  const f=accFlows(accId), bal=(acc.opening_paisa||0)+f.inn-f.out;
  return {acc:acc,rows:rows,f:f,bal:bal};
}

function balanceSheetPrint(){

    .map(a=>({name:a.name,amt:(flip?-1:1)*acctBalanceInRange(a.code,null,asof)}))

  const totalLiab=liabilities.reduce((s,r)=>s+r.amt,0);

function trialBalanceRows(asof){
  return all('chart_of_accounts').slice().sort((a,b)=>a.code.localeCompare(b.code)).map(a=>{
    const lines=all('journal_lines').filter(l=>{
      if(l.account_code!==a.code)return false;
      if(!asof)return true;
      const e=byId('journal_entries',l.entry_id);
      return e&&e.date<=asof;
    });
    const dr=lines.reduce((s,l)=>s+l.debit_paisa,0), cr=lines.reduce((s,l)=>s+l.credit_paisa,0);
    const net=dr-cr;
    return {code:a.code,name:a.name,debit:net>0?net:0,credit:net<0?-net:0};
  }).filter(r=>r.debit||r.credit);
}

function acctBalanceInRange(code,from,to){
  return all('journal_lines').filter(l=>l.account_code===code).reduce((s,l)=>{
    const e=byId('journal_entries',l.entry_id);
    if(!e)return s;
    if(from&&e.date<from)return s;
    if(to&&e.date>to)return s;
    return s+l.debit_paisa-l.credit_paisa;
  },0);
}
function plData(from,to){
  const income=all('chart_of_accounts').filter(a=>a.type==='income').map(a=>({name:a.name,amt:-acctBalanceInRange(a.code,from,to)})).filter(r=>r.amt);
  const expense=all('chart_of_accounts').filter(a=>a.type==='expense').map(a=>({name:a.name,amt:acctBalanceInRange(a.code,from,to)})).filter(r=>r.amt);
  const totalIncome=income.reduce((s,r)=>s+r.amt,0), totalExpense=expense.reduce((s,r)=>s+r.amt,0);
  return {income:income,expense:expense,totalIncome:totalIncome,totalExpense:totalExpense,net:totalIncome-totalExpense};
}

  const assets=byType('asset',false), liabilities=byType('liability',true), equity=byType('equity',true);
  const income=byType('income',true).reduce((s,r)=>s+r.amt,0);
  const expense=byType('expense',false).reduce((s,r)=>s+r.amt,0);
  const netProfit=income-expense;
  const totalAssets=assets.reduce((s,r)=>s+r.amt,0);
  const totalLiab=liabilities.reduce((s,r)=>s+r.amt,0);
  const totalEquity=equity.reduce((s,r)=>s+r.amt,0)+netProfit;
  return {assets,liabilities,equity,netProfit,totalAssets,totalLiab,totalEquity,
    balanced:Math.abs(totalAssets-(totalLiab+totalEquity))<1};
}

/* ===== cash flow statement (direct method — traced from every entry that moved Cash & Bank) ===== */
function cfHumanizeEvent(t){return String(t||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function cfDayBefore(d){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-1);return dt.toISOString().slice(0,10);}
function cashFlowData(from,to){
  const opening=acctBalanceInRange('1000',null,cfDayBefore(from))/100;
  const coaType={}; all('chart_of_accounts').forEach(a=>{coaType[a.code]=a.type;});
  const entryIds=new Set(all('journal_lines').filter(l=>l.account_code==='1000').map(l=>l.entry_id));
  const opRows=[],finRows=[],invRows=[];
  entryIds.forEach(eid=>{
    const entry=byId('journal_entries',eid); if(!entry)return;
    if(entry.date<from||entry.date>to)return;
    const lines=all('journal_lines').filter(l=>l.entry_id===eid);
    const cashNet=lines.filter(l=>l.account_code==='1000').reduce((s,l)=>s+l.debit_paisa-l.credit_paisa,0)/100;
    if(!cashNet)return;
    const otherLines=lines.filter(l=>l.account_code!=='1000');
    const isFinancing=otherLines.some(l=>coaType[l.account_code]==='equity');
    const isInvesting=otherLines.some(l=>coaType[l.account_code]==='fixed_asset');
    const row={date:entry.date,label:entry.memo||cfHumanizeEvent(entry.event_type),amt:cashNet};
    if(isFinancing)finRows.push(row); else if(isInvesting)invRows.push(row); else opRows.push(row);
  });
  const sum=r=>r.reduce((s,x)=>s+x.amt,0);
  const groupBy=(r)=>{const m=new Map();r.forEach(x=>m.set(x.label,(m.get(x.label)||0)+x.amt));
    return Array.from(m.entries()).map(([label,amt])=>({label,amt})).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));};
  const operating=sum(opRows), investing=sum(invRows), financing=sum(finRows);
  const netChange=operating+investing+financing;
  return {opening,closing:opening+netChange,operating,investing,financing,netChange,
    opGrouped:groupBy(opRows),invGrouped:groupBy(invRows),finGrouped:groupBy(finRows)};
}

function n2w(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve',
    'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=(x)=>x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
  const three=(x)=>(x>99?ones[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  let out='';
  const crore=Math.floor(n/10000000);n%=10000000;
  const lakh=Math.floor(n/100000);n%=100000;
  const thou=Math.floor(n/1000);n%=1000;
  if(crore)out+=three(crore)+' Crore ';
  if(lakh)out+=two(lakh)+' Lakh ';
  if(thou)out+=two(thou)+' Thousand ';
  if(n)out+=three(n);
  return out.trim();
}

/* Matches UTN's real Sales Tax Invoice format exactly (verified against issued, stamped invoices
   to Indus Motor Co. and Pak Suzuki) — Buyer/Supplier registration block, a single tariff line at
   Freight + Sindh Sales Tax = gross, and amount in words. Deliberately does NOT print FBR WHT,
   SRB-withholding, other adjustments, or payment/balance status: real SRB tax invoices only ever
   show the gross billed amount, never a receivables position — those stay internal (still tracked
   via invTotal()/invOutstanding() for collections) and surface on the Customer Statement instead. */
/* Layout inspired by a ChatGPT-made mockup the owner shared for styling ideas only — kept the
   letterhead/Bill-To/boxed-total visual structure, but every number and registration detail here
   stays exactly what was verified against UTN's real, stamped invoices (Sindh Sales Tax @ 15% only
   — the mockup's Federal Excise Duty + 18% Sales Tax was invented, not real, so none of that
   carried over). */

    .inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 -18px 14px;padding:14px 18px 12px;

    .inv-top .brand .contact{font-size:9.5px;color:#dbeafe;margin-top:5px;line-height:1.6}

    .inv-total{display:flex;justify-content:flex-end;margin:8px 0}

    .inv-sigboxes{display:flex;gap:10px;margin-top:16px}
    .inv-sigboxes .inv-box{min-height:70px;display:flex;flex-direction:column}

    <div class="doctitle">SALES TAX<br>INVOICE</div>
  </div>
  <div class="inv-boxes">
    <div class="inv-box"><span class="lbl">Bill To</span><b>${esc(nm('customers',i.customer_id))}</b><br>
      ${esc(cust.inv_address||'—')}<br>
      ${cust.inv_phone?'Tel: '+esc(cust.inv_phone)+'<br>':''}
      NTN: ${esc(cust.ntn||'—')} &middot; STRN: ${esc(cust.strn||'—')}</div>
    <div class="inv-box" style="max-width:190px">
      <span class="lbl">Invoice No.</span><b>${esc(i.number)}</b><br><br>
      <span class="lbl">Date</span><b>${esc(fmtDate(invDate(i)))}</b></div>
  </div>
  ${multi?`<table><tr><th colspan="5">Bilties on this invoice (${its.length})</th></tr>
  <tr><th>#</th><th>Bilty</th><th>Date</th><th>Route / vehicle</th><th class="r">Freight</th></tr>
  ${its.map((t,n)=>`<tr><td>${n+1}</td><td>${esc(t.bilty_no)}</td><td>${esc(fmtDate(t.date))}</td>
    <td>${esc(t.route||'—')}${t.veh_make?' — '+esc(t.veh_make):''}</td>
    <td class="r">${pkr(t.freight_paisa)}</td></tr>`).join('')}
  <tr><td colspan="4" class="r"><b>Total freight — ${its.length} bilty(s)</b></td><td class="r"><b>${pkr(its.reduce((s,t)=>s+(t.freight_paisa||0),0))}</b></td></tr>
  </table>`:''}
  <table><tr><th>S.No</th><th>Particulars</th><th class="r">Value Excluding SRB</th><th class="r">SRB @ ${rate}%</th><th class="r">Gross Value Inclusive of SRB</th></tr>

  const inv=t?invoiceForTrip(t.id):null;
  const amt=c.amount_paisa||0;
  const body=`
  <div class="hd"><h1>${esc(CO_NAME)}</h1><div class="t">Credit Note — CN-${c.id}</div></div>
  <table>
  <tr><td class="l">Credit note no.</td><td>CN-${c.id}</td><td class="l">Date</td><td>${esc(fmtDate(c.date))}</td></tr>
  <tr><td class="l">Customer</td><td colspan="3">${esc(t?nm('customers',t.customer_id):'—')}</td></tr>
  <tr><td class="l">Bilty</td><td>${esc(t?t.bilty_no:'—')}</td><td class="l">Route</td><td>${esc(t?t.route:'—')}</td></tr>

  </table>
  <table><tr><th colspan="2">Reason for this credit</th></tr>
  <tr><td>Claim type</td><td>${esc(enumLbl(CLAIM_TYPE,c.type))}</td></tr>
  <tr><td>What happened</td><td>${esc(c.description||'—')}</td></tr>
  ${c.resolution?`<tr><td>How it was settled</td><td>${esc(c.resolution)}</td></tr>`:''}
  ${(c.linked_items||[]).length?`<tr><td>Checklist items affected</td><td>${(c.linked_items||[]).map(i=>esc(CK_ITEMS[i][0])).join(', ')}</td></tr>`:''}
  </table>
  <table><tr><th colspan="2">Amount credited</th></tr>
  <tr><td><b>Total credit to your account</b></td><td class="r"><b>${pkr(amt)}</b></td></tr>

  printOpen('Credit Note CN-'+c.id,body);
}

function geminiKey(){return localStorage.getItem('mucrm_gemini_key')||'';}
function geminiKeySave(){
  const v=V('gm_key');
  if(!v){toast('Enter a key first',true);return;}
  localStorage.setItem('mucrm_gemini_key',v);
  localStorage.removeItem('mucrm_gemini_model');
  toast('Gemini API key saved'); render();
}
function geminiKeyClear(){
  if(!confirm('Remove the saved Gemini API key from this browser?'))return;
  localStorage.removeItem('mucrm_gemini_key');
  localStorage.removeItem('mucrm_gemini_model');
  toast('Key removed'); render();
}

function userForm(id){
  if(!can('settings')){toast('Not permitted',true);return;}
  const rec=id?byId('users',id):{role:'dispatcher',auth_mode:'click'};
  if(id&&!rec){toast('Not found',true);return;}
  openModal(`<h2>${id?'Edit User':'+ Add User'}</h2>
  <div class="fgrid">
    <div class="frow full"><label class="req">Name</label><input id="u_name" value="${esc(rec.name||'')}"></div>
    <div class="frow"><label class="req">Role</label><select id="u_role" onchange="userRoleToggle()">${optHTML(USER_ROLES,rec.role)}</select></div>
    <div class="frow" id="u_driver_row" style="${rec.role==='driver'?'':'display:none'}"><label>Driver record</label><select id="u_driver_id">${fkOptions('drivers',rec.driver_id)}</select></div>
    <div class="frow" id="u_carrier_row" style="${rec.role==='carrier'?'':'display:none'}"><label>Carrier record</label><select id="u_carrier_id">${fkOptions('carriers',rec.carrier_id)}</select></div>
    <div class="frow full"><label>Login type</label>
      <select id="u_auth_mode" onchange="userAuthToggle()">
        <option value="click" ${rec.auth_mode!=='password'?'selected':''}>Quick click (no password)</option>
        <option value="password" ${rec.auth_mode==='password'?'selected':''}>Username + Password</option>
      </select>
    </div>
    <div class="frow" id="u_username_row" style="${rec.auth_mode==='password'?'':'display:none'}"><label class="req">Username</label><input id="u_username" value="${esc(rec.username||'')}"></div>
    <div class="frow" id="u_password_row" style="${rec.auth_mode==='password'?'':'display:none'}"><label${id?'':' class="req"'}>Password${id?' — leave blank to keep current':''}</label><input id="u_password" placeholder="${id?'Leave blank to keep current':'Set a password'}"></div>
  </div>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn" onclick="userSave(${id||'null'})">Save</button></div>`,true);
}
function userRoleToggle(){
  const role=V('u_role');
  document.getElementById('u_driver_row').style.display=role==='driver'?'':'none';
  document.getElementById('u_carrier_row').style.display=role==='carrier'?'':'none';
}
function userAuthToggle(){
  const pw=V('u_auth_mode')==='password';
  document.getElementById('u_username_row').style.display=pw?'':'none';
  document.getElementById('u_password_row').style.display=pw?'':'none';
}
function userSave(id){
  if(!can('settings')){toast('Not permitted',true);return;}
  const name=V('u_name'),role=V('u_role'),authMode=V('u_auth_mode');
  if(!name){toast('Name is required',true);return;}
  const obj={name:name,role:role,auth_mode:authMode,
    driver_id:role==='driver'?(parseInt(V('u_driver_id'),10)||null):null,
    carrier_id:role==='carrier'?(parseInt(V('u_carrier_id'),10)||null):null};
  if(authMode==='password'){
    const uname=V('u_username');
    if(!uname){toast('Username is required for password login',true);return;}
    const dup=all('users').find(u=>u.username===uname&&u.id!==id);
    if(dup){toast('That username is already in use',true);return;}
    obj.username=uname;
    const pass=V('u_password');
    if(pass)obj.password_hash=simpleHash(pass);
    else if(!id){toast('Password is required for a new password-login user',true);return;}
  }else{
    obj.username=null;obj.password_hash=null;
  }
  if(id)upd('users',id,obj);else add('users',obj);
  toast('User saved');closeModal();render();
}
function userDel(id){
  if(!can('settings')){toast('Not permitted',true);return;}
  if(state.user&&state.user.id===id){toast("You can't delete the account you're currently logged in as",true);return;}
  if(!confirm('Delete this user? They will no longer be able to log in.'))return;
  softDel('users',id);
  toast('User deleted');render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mucrm-backup-'+today()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
}
function importData(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.seq||!d.trips||!d.users)throw new Error('bad');
      db=d; saveDB(); toast('Data imported'); render();
    }catch(e){toast('Invalid backup file',true);}
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm('Reset ALL data to the demo seed? Current data in this browser will be lost.'))return;
  db=seedDB(); saveDB(); state.user=byId('users',state.user?state.user.id:1)||null;
  toast('Demo data restored'); render();
}
function genTestBookings(){
  if(!can('settings')){toast('Not permitted',true);return;}
  const custs=all('customers');
  if(!custs.length){toast('Add at least one customer first (Master data → Customers)',true);return;}
  const cities=listVals('city');
  if(cities.length<2){toast('Add at least 2 cities first (Master data → Dropdown Lists)',true);return;}
  const GROUPS=5, PER_GROUP=8;
  if(!confirm('Create 40 test bilties dated across July '+new Date().getFullYear()+', grouped as '+GROUPS+' companies × '+PER_GROUP+' bookings each (one company\'s cars per trip, just like a real carrier run)? They\'ll use your real customers/cities but clearly-marked fake vehicle details, for practicing Create Trips → Trip Expenses → Invoices.\n\nRemove them later with "Clear bookings/trips (keep master data)" above.'))return;
  const makes=['Corolla','Civic','Alto','Cultus','City','Vitz','Prius','Yaris','Fortuner','BR-V'];
  const colours=['White','Black','Silver','Grey','Red','Blue'];
  const year=new Date().getFullYear();
  let created=0,i=0;
  for(let g=0;g<GROUPS;g++){
    const cust=custs[g%custs.length];
    const from=cities[g%cities.length];
    let to=cities[(g+1)%cities.length];
    if(to===from)to=cities[(g+2)%cities.length];
    const day=1+(g*Math.floor(28/(GROUPS-1||1)))%29;
    const date=year+'-07-'+String(day).padStart(2,'0');
    for(let k=0;k<PER_GROUP;k++){
      const bilty='UTN-'+year+'-'+String((db.seq.bilty=(db.seq.bilty||0)+1)).padStart(4,'0');
      const freight=(5+(i%16))*100000;
      add('trips',{entry_mode:'manual_logged',bilty_no:bilty,date:date,booking_id:null,
        customer_id:cust.id,route:from+' → '+to,consigner:cust.name,consignee:'Test Consignee '+(i+1),consignee_address:'',
        carrier_id:null,driver_id:null,booking_time:'',return_load_type:'none',status:'booked',
        freight_paisa:freight,open_market:false,
        rate_agreement_id:null,rate_overridden:false,media_ref:'',
        veh_make:makes[i%makes.length],veh_type:'',veh_chassis:'TEST-CH-'+String(i+1).padStart(4,'0'),veh_engine:'TEST-EN-'+String(i+1).padStart(4,'0'),
        veh_colour:colours[i%colours.length],veh_model:String(year-2),veh_reg:'',veh_condition:'Good',
        notes:'TEST DATA — generated for workflow testing',journey_id:null,load_from:null,load_to:null,pay_status:'to_be_billed'});
      created++;i++;
    }
  }
  toast(created+' test bilties created across July '+year+' ('+GROUPS+' companies × '+PER_GROUP+') — see Booking Register.');
  render();
}
function wipeTransactions(){
  if(!confirm('This clears all bookings, bilties/trips, journeys, expenses, fuel, invoices, payables, claims, checklists and related records in this browser — keeping your customers, carriers, drivers, vendors, clearing agents and rate agreements intact.\n\nA full backup will download automatically first, just in case.\n\nContinue?'))return;
  exportData();
  const WIPE=['bookings','trips','checklists','expenses','vendortx','agentcharges','invoices','inpayments','payables','outpayments','claims','overrides','journeys','fuel','fueltransfers','overheads','vouchersigned','journal_entries','journal_lines','contras','paypromises'];
  WIPE.forEach(c=>{ db[c]=[]; db.seq[c]=0; });
  saveDB();
  toast('Backup downloaded — bookings/trips cleared, master data kept');
  render();
}
function wipeToBlank(){
  if(!confirm('This permanently erases ALL business data in this browser — customers, rate agreements, carriers, drivers, vendors, bookings, bilties, trips, expenses, fuel, invoices, payables, claims, everything — keeping only the login users, dropdown lists and default accounts.\n\nA full backup will download automatically first, just in case.\n\nContinue?'))return;
  exportData();
  const KEEP=['users','listopts','accounts','chart_of_accounts'];
  COLLS.forEach(c=>{ if(!KEEP.includes(c)){ db[c]=[]; db.seq[c]=0; } });
  saveDB();
  toast('Backup downloaded — all business data cleared, starting from a clean slate');
  render();
}

function loginSelectContinue(){
  const uid=parseInt(V('login_user_select'),10)||null;
  if(!uid){toast('Select your name first',true);return;}
  loginPick(uid);
}
function loginPick(uid){
  const u=byId('users',uid); if(!u)return;
  if(u.auth_mode==='password'){window._loginSelected=uid;render();return;}
  login(uid);
}
function loginPickPassword(uid){
  const u=byId('users',uid); if(!u)return;
  const pass=(document.getElementById('login_password')||{}).value||'';
  if(simpleHash(pass)!==u.password_hash){toast('Wrong password',true);return;}
  window._loginSelected=null;
  login(uid);
}
/* Live clock in the topbar — set up once at boot, not inside render(), since render() runs on
   every save/toggle throughout the app and would otherwise stack a new interval each time. */
const WEEKDAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function topClockText(){
  const d=new Date();
  let h=d.getHours(); const ampm=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  const mm=String(d.getMinutes()).padStart(2,'0');
  return `${WEEKDAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getFullYear()} · ${h}:${mm} ${ampm}`;
}
function topClockTick(){
  const el=document.getElementById('topClock');
  if(el)el.textContent=topClockText();
}
/* ===== S8: boot ===== */
loadDB();
(function(){
  const uid=parseInt(sessionStorage.getItem('mucrm_uid'),10);
  if(uid){const u=byId('users',uid); if(u)state.user=u;}
})();
window.addEventListener('hashchange',render);
render();
setInterval(topClockTick,1000);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

function toggleTopic(el){
  const items=el.nextElementSibling;
  if(items)items.style.display=items.style.display==='none'?'block':'none';
  el.style.opacity=el.style.opacity==='0.6'?'1':'0.6';
}

function toggleFAQ(el){
  const ans=el.nextElementSibling;
  if(ans)ans.style.display=ans.style.display==='none'?'block':'none';
  el.style.color=el.style.color==='#0176D3'?'#032D60':'#0176D3';
}

function filterHelpFAQ(){
  const q=V('helpSearchInput').toLowerCase();
  document.querySelectorAll('.faq-topic').forEach(t=>{
    const items=t.querySelectorAll('.faq');
    let show=false;
    items.forEach(f=>{
      const match=f.textContent.toLowerCase().includes(q);
      f.style.display=match?'block':'none';
      if(match)show=true;
    });
    t.style.display=show||!q?'block':'none';
  });
}
