version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loadyar_postgres
    environment:
      POSTGRES_USER: loadyar
      POSTGRES_PASSWORD: loadyar
      POSTGRES_DB: loadyar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadyar -d loadyar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loadyar

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loadyar_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@loadyar.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - loadyar

volumes:
  postgres_data:

networks:
  loadyar:
    driver: bridge
