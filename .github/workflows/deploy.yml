name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install and authenticate doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_TOKEN }}

    - name: Create DigitalOcean App
      run: |
        set -e
        echo "Deploying LoadYar to DigitalOcean..."
        doctl apps create --spec app.yaml --wait --format id,default_ingress,status
        echo "✅ Deployment successful!"

    - name: Get app details
      run: |
        echo "LoadYar is now live! 🚀"
        doctl apps list --format name,id,status
